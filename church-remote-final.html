<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06111f">
<title>BibleGoldenBell 4X4 · Church Remote</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  color:#f7f8fa;background:#06111f;
  --bg:#06111f;--panel:#081522;--line:#183453;--muted:#9fb0c7;--accent:#ff9000;
  --team1:#f4a11a;--team2:#4e9be8;--team3:#8f7ee8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{display:flex;flex-direction:column;overflow:hidden}
.remote-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  min-height:52px;padding:8px 10px;border-bottom:1px solid var(--line);
  background:var(--panel);z-index:20
}
.remote-brand{font-size:14px;font-weight:950;white-space:nowrap}
.remote-brand b{color:var(--accent)}
.remote-role{
  height:34px;padding:0 9px;border:1px solid #294565;border-radius:8px;
  background:#0b1928;color:#fff;font-size:13px;font-weight:850
}
.remote-btn{
  min-height:34px;padding:0 11px;border:1px solid #315474;border-radius:8px;
  background:#102238;color:#fff;font-size:12px;font-weight:900;cursor:pointer
}
.remote-btn.primary{border-color:var(--accent);background:var(--accent);color:#07111d}
.remote-btn.danger{border-color:#7a3a42;background:#30191e;color:#ffc0c5}
.remote-btn:disabled{opacity:.4;cursor:not-allowed}
.remote-status{
  margin-left:auto;min-height:30px;display:flex;align-items:center;gap:7px;padding:0 10px;
  border:1px solid #294565;border-radius:999px;color:var(--muted);font-size:11px;font-weight:850;white-space:nowrap
}
.remote-status:before{content:'';width:8px;height:8px;border-radius:50%;background:#718096}
.remote-status.ok:before{background:#43d17a}.remote-status.warn:before{background:#ffb14d}.remote-status.bad:before{background:#ff6868}

.frame-wrap{position:relative;flex:1;min-height:0}
.game-frame{display:block;width:100%;height:100%;border:0;background:var(--bg)}

.remote-help{
  display:none;padding:7px 10px;border-top:1px solid var(--line);background:var(--panel);
  color:var(--muted);font-size:11px;font-weight:800;line-height:1.45;text-align:center
}
.remote-help.show{display:block}

.team-pop{
  position:fixed;z-index:90;min-width:220px;padding:10px;border:1px solid #315474;
  border-radius:12px;background:#071522;box-shadow:0 14px 32px rgba(0,0,0,.45)
}
.team-pop.hidden{display:none}
.team-pop-title{margin:0 0 8px;color:#e1ebf7;font-size:12px;font-weight:950;text-align:center}
.team-pop-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.team-pop-actions button{
  min-height:44px;border:1px solid #315474;border-radius:8px;background:#102238;color:#fff;font-weight:950
}
.team-pop-actions .team1{border-color:var(--team1)}
.team-pop-actions .team2{border-color:var(--team2)}
.team-pop-actions .team3{border-color:var(--team3)}
.team-pop-actions .clear{grid-column:1/-1;color:#d0d9e5}
.team-pop-note{margin-top:7px;color:#93a1b4;font-size:10px;text-align:center}

.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;
  max-width:min(92vw,520px);padding:10px 14px;border:1px solid #315474;border-radius:10px;
  background:#071522;color:#fff;font-size:12px;font-weight:850;box-shadow:0 10px 28px rgba(0,0,0,.38)
}
.toast.hidden{display:none}

@media(max-width:760px){
  body{overflow:auto}
  .remote-bar{gap:6px;padding:7px 8px}
  .remote-brand{width:100%}
  .remote-status{order:10;margin-left:0;width:100%;justify-content:center}
  .remote-role{flex:1;min-width:120px}
  .remote-btn{flex:1}
  .frame-wrap{min-height:calc(100vh - 126px)}
}
</style>
</head>
<body>
<header class="remote-bar">
  <div class="remote-brand">도전 바이블 <b>교회 원격</b></div>

  <select id="role" class="remote-role" aria-label="원격 역할">
    <option value="display">방송 화면</option>
    <option value="controller">사회자</option>
  </select>

  <button id="connectBtn" class="remote-btn primary" type="button">연결</button>
  <button id="copyLinkBtn" class="remote-btn" type="button" hidden>사회자 링크 복사</button>
  <button id="rotateBtn" class="remote-btn" type="button" hidden>새 연결키</button>
  <button id="resetBtn" class="remote-btn danger" type="button" hidden>전체 초기화</button>

  <div id="status" class="remote-status">연결 안 됨</div>
</header>

<div class="frame-wrap">
  <iframe id="game" class="game-frame" src="./index.html" allowfullscreen></iframe>
</div>

<div id="remoteHelp" class="remote-help">
  번호를 탭하면 문제를 엽니다. 팀전에서는 번호를 약 0.6초 길게 눌러 팀 색을 지정하거나 해제할 수 있습니다.
</div>

<div id="teamPop" class="team-pop hidden" role="dialog" aria-modal="true">
  <div id="teamPopTitle" class="team-pop-title">팀 지정</div>
  <div id="teamPopActions" class="team-pop-actions"></div>
  <div class="team-pop-note">아직 풀지 않은 문제에는 팀 색을 지정할 수 없습니다.</div>
</div>

<div id="toast" class="toast hidden" aria-live="polite"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {
  getAuth, signInAnonymously, setPersistence, browserLocalPersistence
} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import {
  getDatabase, ref, set, get, onValue, remove
} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js';

const firebaseConfig={
  apiKey:'AIzaSyAB3YZfk2xUbZC90i3hlBeVYUXXa9vczsA',
  authDomain:'biblegoldenbell-remote.firebaseapp.com',
  databaseURL:'https://biblegoldenbell-remote-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:'biblegoldenbell-remote',
  storageBucket:'biblegoldenbell-remote.firebasestorage.app',
  messagingSenderId:'729731199303',
  appId:'1:729731199303:web:1e0d9a58765e7b5c029c62'
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

const frame=document.getElementById('game');
const roleEl=document.getElementById('role');
const connectBtn=document.getElementById('connectBtn');
const copyLinkBtn=document.getElementById('copyLinkBtn');
const rotateBtn=document.getElementById('rotateBtn');
const resetBtn=document.getElementById('resetBtn');
const statusEl=document.getElementById('status');
const remoteHelp=document.getElementById('remoteHelp');
const teamPop=document.getElementById('teamPop');
const teamPopTitle=document.getElementById('teamPopTitle');
const teamPopActions=document.getElementById('teamPopActions');
const toastEl=document.getElementById('toast');

const OWNER_STORE='bb4_remote_owner_session_v2';
const CONTROLLER_STORE='bb4_remote_controller_session_v2';
const OWNER_KEY_STORE='bb4_remote_private_owner_key_v1';

let user=null;
let role='display';
let connected=false;
let roomId='';
let roomKey='';
let proofHash='';
let unsubs=[];
let heartbeatTimer=null;
let bridgeTimer=null;
let displayState=null;
let lastCommandId=null;
let lastDisplaySignature='';
let pressTimer=null;
let longPressFired=false;
let toastTimer=null;

const touch=(navigator.maxTouchPoints||0)>0||matchMedia('(pointer:coarse)').matches;

function gameWindow(){return frame.contentWindow}
function gameDoc(){try{return frame.contentDocument||frame.contentWindow.document}catch{return null}}

function status(text,cls=''){
  statusEl.textContent=text;
  statusEl.className='remote-status '+cls;
}
function toast(text){
  toastEl.textContent=text;
  toastEl.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.add('hidden'),2200);
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function safeJson(raw){try{return JSON.parse(raw||'null')}catch{return null}}
function readLocalJson(key){return safeJson(localStorage.getItem(key))}
function saveLocalJson(key,value){localStorage.setItem(key,JSON.stringify(value))}
function removeLocal(key){localStorage.removeItem(key)}

function randomToken(bytes=24){
  const arr=new Uint8Array(bytes);
  crypto.getRandomValues(arr);
  let s='';
  for(const b of arr)s+=String.fromCharCode(b);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function sha256Hex(text){
  const bytes=new TextEncoder().encode(text);
  const digest=await crypto.subtle.digest('SHA-256',bytes);
  return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function getPrivateOwnerKey(){
  let key=localStorage.getItem(OWNER_KEY_STORE)||'';
  if(key)return key;
  key=prompt('교회 원격 관리자 키를 입력하세요. 처음 이 기기에서 방송 화면을 연결할 때만 필요합니다.')||'';
  key=key.trim();
  if(!key)throw new Error('NO_OWNER_KEY');
  localStorage.setItem(OWNER_KEY_STORE,key);
  return key;
}
function getFragment(){
  const raw=location.hash.replace(/^#/,'');
  const p=new URLSearchParams(raw);
  return {
    role:p.get('role')||'',
    room:p.get('room')||'',
    key:p.get('key')||''
  };
}
function setRoleFromContext(){
  const f=getFragment();
  if(f.role==='controller')roleEl.value='controller';
  else if(f.role==='display')roleEl.value='display';
  else roleEl.value=touch?'controller':'display';
}

function stablePackFingerprint(){
  const state=readLocalJson('bb4_state_v3')||{};
  const qs=Array.isArray(state.questions)?state.questions:[];
  const data=qs.map(q=>({
    n:q.number,t:q.type,at:q.answerType,
    q:String(q.question||''),a:String(q.answer||''),h:String(q.hint||''),
    c:Array.isArray(q.choices)?q.choices.map(x=>String(x||'')):[],
    cc:q.correctChoice,ox:q.oxAnswer
  }));
  const str=JSON.stringify(data);
  let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}
  return ('00000000'+(h>>>0).toString(16)).slice(-8);
}
function mode(){
  const s=readLocalJson('bb4_state_v3')||{};
  const m=String(s.settings?.mode||'3');
  return ['individual','2','3'].includes(m)?m:'3';
}
function progress(){
  return readLocalJson('bb4_progress_v3')||{
    owners:Array(16).fill(0),
    visited:Array(16).fill(false),
    lastQuestion:null
  };
}
function currentDisplayPayload(){
  const p=progress();
  return {
    mode:mode(),
    packFingerprint:stablePackFingerprint(),
    updatedAt:Date.now(),
    progress:{
      owners:Array.from({length:16},(_,i)=>Number(p.owners?.[i]||0)),
      visited:Array.from({length:16},(_,i)=>p.visited?.[i]===true),
      lastQuestion:Number.isInteger(p.lastQuestion)?p.lastQuestion:null
    }
  };
}
function displaySignature(payload){
  return JSON.stringify({
    mode:payload.mode,
    packFingerprint:payload.packFingerprint,
    progress:payload.progress
  });
}
function modeLabel(m){return m==='individual'?'개인':m==='2'?'2팀':'3팀'}

async function ensureAuth(){
  if(auth.currentUser){user=auth.currentUser;return user}
  try{
    await setPersistence(auth,browserLocalPersistence);
    const result=await signInAnonymously(auth);
    user=result.user;
    return user;
  }catch(err){
    console.error(err);
    status('Firebase 익명 인증을 켜야 합니다','bad');
    throw err;
  }
}

function controllerLink(){
  if(!roomId||!roomKey)return '';
  const base=location.origin+location.pathname;
  const frag=new URLSearchParams({role:'controller',room:roomId,key:roomKey});
  return `${base}#${frag.toString()}`;
}
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    const ok=document.execCommand('copy');
    ta.remove();
    return ok;
  }
}

async function createOwnerRoom(deleteOld=false){
  await ensureAuth();

  const old=readLocalJson(OWNER_STORE);
  if(deleteOld&&old?.room&&old?.ownerUid===user.uid){
    try{await remove(ref(db,`rooms/${old.room}`))}catch{}
  }

  roomId=randomToken(12);
  roomKey=randomToken(32);
  proofHash=await sha256Hex(roomKey);
  const ownerProof=await sha256Hex(getPrivateOwnerKey());

  const initial={
    ownerUid:user.uid,
    ownerProof,
    joinSecretHash:proofHash,
    createdAt:Date.now(),
    members:{
      [user.uid]:{role:'display',proof:proofHash}
    },
    state:currentDisplayPayload()
  };

  await set(ref(db,`rooms/${roomId}`),initial);
  saveLocalJson(OWNER_STORE,{room:roomId,key:roomKey,ownerUid:user.uid});
}

async function loadOrCreateOwnerRoom(){
  await ensureAuth();
  const saved=readLocalJson(OWNER_STORE);

  if(saved?.room&&saved?.key&&saved?.ownerUid===user.uid){
    roomId=saved.room;
    roomKey=saved.key;
    proofHash=await sha256Hex(roomKey);
    try{
      await set(ref(db,`rooms/${roomId}/state`),currentDisplayPayload());
      return;
    }catch{
      removeLocal(OWNER_STORE);
    }
  }

  await createOwnerRoom(false);
}

async function loadControllerSession(){
  await ensureAuth();

  const f=getFragment();
  let session=null;

  if(f.room&&f.key){
    session={room:f.room,key:f.key};
    saveLocalJson(CONTROLLER_STORE,session);
  }else{
    session=readLocalJson(CONTROLLER_STORE);
  }

  if(!session?.room||!session?.key){
    throw new Error('NO_CONTROLLER_LINK');
  }

  roomId=session.room;
  roomKey=session.key;
  proofHash=await sha256Hex(roomKey);

  await set(ref(db,`rooms/${roomId}/members/${user.uid}`),{
    role:'controller',
    proof:proofHash,
    joinedAt:Date.now()
  });

  if(f.room&&f.key){
    history.replaceState(null,'',location.pathname+location.search+'#role=controller');
  }
}

function stopRealtime(){
  for(const u of unsubs){try{u()}catch{}}
  unsubs=[];
  clearInterval(heartbeatTimer);heartbeatTimer=null;
  clearInterval(bridgeTimer);bridgeTimer=null;
  lastCommandId=null;
  displayState=null;
  lastDisplaySignature='';
}
function updateChrome(){
  copyLinkBtn.hidden=!(connected&&role==='display');
  rotateBtn.hidden=!(connected&&role==='display');
  resetBtn.hidden=!(connected&&role==='controller');
  remoteHelp.classList.toggle('show',connected&&role==='controller');
}
async function disconnect(){
  stopRealtime();
  connected=false;
  connectBtn.textContent='연결';
  connectBtn.classList.add('primary');
  status('연결 안 됨');
  updateChrome();
}

async function publishDisplayState(force=false){
  if(!connected||role!=='display'||!roomId)return;
  const payload=currentDisplayPayload();
  const sig=displaySignature(payload);

  if(!force&&sig===lastDisplaySignature)return;
  await set(ref(db,`rooms/${roomId}/state`),payload);
  lastDisplaySignature=sig;
  status(`방송 수신 대기 · ${modeLabel(payload.mode)}`,'ok');
}
async function heartbeat(){
  if(!connected||role!=='display')return;
  const payload=currentDisplayPayload();
  await set(ref(db,`rooms/${roomId}/state`),payload);
  lastDisplaySignature=displaySignature(payload);
}
async function sendCommand(action,payload={},label='명령'){
  if(!connected||role!=='controller'){
    status('사회자 연결이 필요합니다','warn');
    return false;
  }
  const cmd={
    id:`${Date.now()}-${randomToken(6)}`,
    action,
    payload,
    sentAt:Date.now(),
    packFingerprint:stablePackFingerprint()
  };
  await set(ref(db,`rooms/${roomId}/command`),cmd);
  status(`${label} 전송됨`,'ok');
  return true;
}

function waitFor(selector,timeout=1800){
  return new Promise(resolve=>{
    const start=Date.now();
    const tick=()=>{
      const el=gameDoc()?.querySelector(selector);
      if(el)return resolve(el);
      if(Date.now()-start>timeout)return resolve(null);
      setTimeout(tick,35);
    };
    tick();
  });
}
async function goBoard(){
  const d=gameDoc();
  const b=d?.querySelector('#boardBtn,#quickBoardBtn');
  if(b){b.click();await sleep(100);return true}
  return !!d?.querySelector('[data-cell]');
}
async function displayOpenQuestion(index){
  const w=gameWindow();
  if(typeof w.openQuestion==='function'){
    await w.openQuestion(index);
    return true;
  }
  await goBoard();
  const cell=await waitFor(`[data-cell="${index}"]`);
  if(!cell)return false;
  cell.click();
  return true;
}
async function displaySetAnswer(visible){
  const b=await waitFor('#answerBtn');
  if(!b)return false;
  const isAnswer=String(b.textContent||'').includes('문제 다시 보기');
  if(isAnswer!==!!visible)b.click();
  return true;
}
async function displayAssignTeam(index,team){
  await goBoard();
  const d=gameDoc();
  const p=progress();
  if(p.visited?.[index]!==true)return false;

  const action=await waitFor(`[data-mini-action="${team}"]`);
  if(!action)return false;
  action.click();
  await sleep(45);

  const cell=await waitFor(`[data-mini-cell="${index}"]`);
  if(!cell||cell.disabled)return false;
  cell.click();
  return true;
}
async function displayUnclaim(index){
  await goBoard();
  const p=progress();
  if(p.visited?.[index]!==true)return false;

  const miss=await waitFor('[data-mini-action="miss"]');
  if(!miss)return false;
  miss.click();
  await sleep(45);

  const cell=await waitFor(`[data-mini-cell="${index}"]`);
  if(!cell||cell.disabled)return false;
  cell.click();
  return true;
}
async function displayReset(){
  const w=gameWindow();
  if(typeof w.resetProgress==='function'){
    const promise=w.resetProgress();
    await sleep(60);
    gameDoc()?.querySelector('#resetConfirm')?.click();
    await promise;
    return true;
  }
  return false;
}

async function applyCommand(cmd){
  if(!cmd?.action)return;
  const action=cmd.action;
  const payload=cmd.payload||{};

  if(action==='OPEN_QUESTION'){
    const i=Math.max(0,Math.min(15,Number(payload.index)||0));
    const ok=await displayOpenQuestion(i);
    if(!ok)status(`${i+1}번 문제 실행 실패`,'bad');
  }
  else if(action==='SET_ANSWER'){
    const ok=await displaySetAnswer(!!payload.visible);
    if(!ok)status('정답 버튼을 찾지 못함','bad');
  }
  else if(action==='BOARD'){
    await goBoard();
  }
  else if(action==='ASSIGN_TEAM'){
    const i=Math.max(0,Math.min(15,Number(payload.index)||0));
    const t=Math.max(1,Math.min(3,Number(payload.team)||1));
    const ok=await displayAssignTeam(i,t);
    if(!ok)status(`${i+1}번 팀 지정 실패`,'bad');
  }
  else if(action==='UNCLAIM'){
    const i=Math.max(0,Math.min(15,Number(payload.index)||0));
    const ok=await displayUnclaim(i);
    if(!ok)status(`${i+1}번 팀 해제 실패`,'bad');
  }
  else if(action==='RESET_PROGRESS'){
    await displayReset();
  }

  await sleep(150);
  await publishDisplayState(true);
}

function syncPhoneBoardStyles(){
  if(role!=='controller'||!displayState)return;
  const d=gameDoc();
  if(!d)return;

  const owners=displayState.progress?.owners||[];
  const visited=displayState.progress?.visited||[];

  d.querySelectorAll('[data-mobile-preview]').forEach(btn=>{
    const i=Number(btn.dataset.mobilePreview);
    const owner=Number(owners[i]||0);
    const used=visited[i]===true;

    btn.style.boxShadow='';
    btn.style.borderColor='';
    btn.style.background='';
    btn.style.color='';

    if(owner===1){
      btn.style.background='linear-gradient(145deg,#b76b00,#7d4700)';
      btn.style.borderColor='#f4a11a';btn.style.color='#fff';
    }else if(owner===2){
      btn.style.background='linear-gradient(145deg,#246ba8,#16456f)';
      btn.style.borderColor='#4e9be8';btn.style.color='#fff';
    }else if(owner===3){
      btn.style.background='linear-gradient(145deg,#6252b5,#40347f)';
      btn.style.borderColor='#8f7ee8';btn.style.color='#fff';
    }else if(used){
      btn.style.background='linear-gradient(180deg,#303846,#252c37)';
      btn.style.borderColor='#687180';btn.style.color='#c7cdd6';
    }
  });
}

function closeTeamPop(){
  teamPop.classList.add('hidden');
  teamPopActions.innerHTML='';
}
function openTeamPop(index,anchor){
  const m=displayState?.mode||'individual';
  if(m==='individual')return;

  const visited=displayState?.progress?.visited?.[index]===true;
  teamPopTitle.textContent=`${index+1}번 · 팀 지정`;
  teamPopActions.innerHTML='';

  if(!visited){
    const b=document.createElement('button');
    b.type='button';
    b.textContent='먼저 문제를 열어주세요';
    b.disabled=true;
    b.style.gridColumn='1/-1';
    teamPopActions.appendChild(b);
  }else{
    const teams=m==='2'?[1,2]:[1,2,3];
    for(const team of teams){
      const b=document.createElement('button');
      b.type='button';
      b.className=`team${team}`;
      b.textContent=`${team}팀`;
      b.addEventListener('click',async()=>{
        try{
          await sendCommand('ASSIGN_TEAM',{index,team},`${index+1}번 ${team}팀`);
          closeTeamPop();
        }catch(err){
          console.error(err);status('팀 지정 전송 실패','bad');
        }
      });
      teamPopActions.appendChild(b);
    }

    const clear=document.createElement('button');
    clear.type='button';
    clear.className='clear';
    clear.textContent='팀 색 해제';
    clear.addEventListener('click',async()=>{
      try{
        await sendCommand('UNCLAIM',{index},`${index+1}번 팀 해제`);
        closeTeamPop();
      }catch(err){
        console.error(err);status('팀 해제 전송 실패','bad');
      }
    });
    teamPopActions.appendChild(clear);
  }

  const r=anchor.getBoundingClientRect();
  const left=Math.max(8,Math.min(window.innerWidth-228,r.left));
  const top=Math.max(8,Math.min(window.innerHeight-210,r.bottom+8));
  teamPop.style.left=`${left}px`;
  teamPop.style.top=`${top}px`;
  teamPop.classList.remove('hidden');
}

function installIframeBridge(){
  const d=gameDoc();
  if(!d)return;

  d.querySelectorAll('[data-mobile-preview]').forEach(btn=>{
    btn.style.webkitTouchCallout='none';
    btn.style.userSelect='none';
    btn.style.touchAction='manipulation';
  });

  syncPhoneBoardStyles();

  if(d.documentElement.dataset.secureRemoteBridge==='1')return;
  d.documentElement.dataset.secureRemoteBridge='1';

  const previewButton=e=>{
    const target=e.target?.nodeType===1?e.target:e.target?.parentElement;
    return target?.closest?.('[data-mobile-preview]')||null;
  };

  d.addEventListener('contextmenu',e=>{
    if(role==='controller'&&connected&&previewButton(e))e.preventDefault();
  },true);

  d.addEventListener('pointerdown',e=>{
    if(role!=='controller'||!connected)return;
    const btn=previewButton(e);
    if(!btn)return;

    const index=Number(btn.dataset.mobilePreview);
    if(!Number.isInteger(index))return;

    longPressFired=false;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(()=>{
      const m=displayState?.mode||'individual';
      if(m==='individual')return;
      longPressFired=true;
      try{navigator.vibrate?.(25)}catch{}
      openTeamPop(index,btn);
    },580);
  },true);

  const cancelPress=()=>{clearTimeout(pressTimer);pressTimer=null};
  d.addEventListener('pointerup',cancelPress,true);
  d.addEventListener('pointercancel',cancelPress,true);

  d.addEventListener('click',e=>{
    if(!connected)return;
    const target=e.target?.nodeType===1?e.target:e.target?.parentElement;

    if(role==='controller'){
      const btn=target?.closest?.('[data-mobile-preview]');
      if(btn){
        const index=Number(btn.dataset.mobilePreview);

        if(longPressFired){
          e.preventDefault();
          e.stopImmediatePropagation();
          longPressFired=false;
          return;
        }

        if(Number.isInteger(index)){
          sendCommand('OPEN_QUESTION',{index},`${index+1}번 문제`).catch(err=>{
            console.error(err);status('문제 전송 실패','bad');
          });
        }
        return;
      }

      const answerBtn=target?.closest?.('#mobileAnswerToggle');
      if(answerBtn){
        const next=String(answerBtn.textContent||'').includes('정답 보기');
        sendCommand('SET_ANSWER',{visible:next},next?'정답 보기':'문제 다시 보기').catch(err=>{
          console.error(err);status('정답 전송 실패','bad');
        });
        return;
      }

      const boardBtn=target?.closest?.('#mobileBackToBoard');
      if(boardBtn){
        sendCommand('BOARD',{},'문제판').catch(err=>{
          console.error(err);status('문제판 전송 실패','bad');
        });
        return;
      }
    }

    if(role==='display'){
      setTimeout(()=>publishDisplayState(true).catch(()=>{}),220);
    }
  },true);
}

async function connectDisplay(){
  await loadOrCreateOwnerRoom();
  connected=true;
  role='display';

  let first=true;
  const unsub=onValue(
    ref(db,`rooms/${roomId}/command`),
    snap=>{
      const cmd=snap.val();
      if(first){
        first=false;
        lastCommandId=cmd?.id||null;
        publishDisplayState(true).catch(()=>{});
        return;
      }
      if(!cmd?.id||cmd.id===lastCommandId)return;
      lastCommandId=cmd.id;
      applyCommand(cmd).catch(err=>{
        console.error(err);status('원격 명령 처리 오류','bad');
      });
    },
    err=>{
      console.error(err);status('Firebase 수신 오류','bad');
    }
  );
  unsubs.push(unsub);

  await publishDisplayState(true);
  heartbeatTimer=setInterval(()=>heartbeat().catch(()=>{}),8000);
  bridgeTimer=setInterval(installIframeBridge,800);
  status(`방송 수신 대기 · ${modeLabel(mode())}`,'ok');
}

async function connectController(){
  await loadControllerSession();
  connected=true;
  role='controller';

  const unsub=onValue(
    ref(db,`rooms/${roomId}/state`),
    snap=>{
      displayState=snap.val()||null;
      if(!displayState){
        status('방송 화면 대기 중','warn');
        return;
      }

      const age=Date.now()-Number(displayState.updatedAt||0);
      const packOk=displayState.packFingerprint===stablePackFingerprint();

      if(age>20000){
        status('방송 화면 오프라인 또는 대기 중','warn');
      }else if(!packOk){
        status('방송 연결됨 · 문제팩 확인 필요','warn');
      }else{
        status(`방송 연결됨 · ${modeLabel(displayState.mode)}`,'ok');
      }

      syncPhoneBoardStyles();
    },
    err=>{
      console.error(err);status('Firebase 상태 수신 오류','bad');
    }
  );
  unsubs.push(unsub);

  bridgeTimer=setInterval(installIframeBridge,700);
  installIframeBridge();
}

async function connect(){
  if(connected){await disconnect();return}

  role=roleEl.value;
  status('보안 연결 중…','warn');
  connectBtn.disabled=true;

  try{
    if(role==='display'){
      await connectDisplay();
    }else{
      await connectController();
    }

    connectBtn.textContent='연결 끊기';
    connectBtn.classList.remove('primary');
    updateChrome();
  }catch(err){
    console.error(err);
    connected=false;

    if(String(err?.message||'').includes('NO_CONTROLLER_LINK')){
      status('사회자 링크로 접속하세요','bad');
    }else if(String(err?.message||'').includes('NO_OWNER_KEY')){
      status('교회 원격 관리자 키가 필요합니다','bad');
    }else if(String(err?.code||'').includes('operation-not-allowed')){
      status('Firebase 익명 인증을 켜야 합니다','bad');
    }else if(String(err?.code||'').includes('permission-denied')){
      status(role==='display'?'관리자 키 또는 Firebase 보안 규칙을 확인하세요':'사회자 링크가 만료되었거나 권한이 없습니다','bad');
    }else{
      status('연결 실패','bad');
    }
    updateChrome();
  }finally{
    connectBtn.disabled=false;
  }
}

connectBtn.addEventListener('click',connect);

copyLinkBtn.addEventListener('click',async()=>{
  const link=controllerLink();
  if(!link)return;
  const ok=await copyText(link);
  toast(ok?'사회자 링크를 복사했습니다.':'링크 복사에 실패했습니다.');
});

rotateBtn.addEventListener('click',async()=>{
  if(!connected||role!=='display')return;
  if(!confirm('새 연결키를 만들까요? 기존 사회자 링크는 더 이상 이 방송 화면을 조작하지 못합니다.'))return;

  try{
    status('새 연결키 생성 중…','warn');
    stopRealtime();
    connected=false;
    await createOwnerRoom(true);
    await connectDisplay();
    connectBtn.textContent='연결 끊기';
    connectBtn.classList.remove('primary');
    updateChrome();
    toast('새 연결키를 만들었습니다. 새 사회자 링크를 다시 보내세요.');
  }catch(err){
    console.error(err);status('새 연결키 생성 실패','bad');
  }
});

resetBtn.addEventListener('click',async()=>{
  if(!connected||role!=='controller')return;
  if(!confirm('문제 사용 표시와 팀 색을 모두 초기화할까요? 문제와 미디어 데이터는 지워지지 않습니다.'))return;
  try{
    await sendCommand('RESET_PROGRESS',{},'전체 초기화');
  }catch(err){
    console.error(err);status('초기화 전송 실패','bad');
  }
});

roleEl.addEventListener('change',async()=>{
  if(connected)await disconnect();
  role=roleEl.value;
  updateChrome();
});

document.addEventListener('pointerdown',e=>{
  if(!teamPop.classList.contains('hidden')&&!teamPop.contains(e.target))closeTeamPop();
});

frame.addEventListener('load',()=>{
  setTimeout(installIframeBridge,120);
  if(connected&&role==='display'){
    setTimeout(()=>publishDisplayState(true).catch(()=>{}),260);
  }
});

setRoleFromContext();
role=roleEl.value;
updateChrome();
</script>
