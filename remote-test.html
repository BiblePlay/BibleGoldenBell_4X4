<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06111f">
<title>BibleGoldenBell 4X4 · Remote Test</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#f7f8fa;background:#06111f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06111f}body{display:flex;flex-direction:column}
.remote-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid #183453;background:#081522;color:#f7f8fa;z-index:10}
.remote-brand{font-weight:900;white-space:nowrap}.remote-brand b{color:#ff9000}.remote-field{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#aab7c8}.remote-field input,.remote-field select{height:34px;border:1px solid #294565;border-radius:7px;background:#0b1928;color:#fff;padding:0 9px;font-size:14px;font-weight:800}.remote-field input{width:112px;text-transform:uppercase}.remote-connect{height:34px;padding:0 13px;border:0;border-radius:7px;background:#ff9000;color:#07111d;font-weight:950;cursor:pointer}.remote-connect.off{background:#27384c;color:#dce6f2}.remote-status{margin-left:auto;min-height:30px;display:flex;align-items:center;gap:7px;padding:0 10px;border:1px solid #294565;border-radius:999px;color:#9fb0c7;font-size:12px;font-weight:850;white-space:nowrap}.remote-status:before{content:'';width:8px;height:8px;border-radius:50%;background:#718096}.remote-status.ok:before{background:#43d17a}.remote-status.warn:before{background:#ffb14d}.remote-status.bad:before{background:#ff6868}
.frame-wrap{position:relative;flex:1;min-height:0}.game-frame{display:block;width:100%;height:calc(100vh - 53px);border:0;background:#06111f}
.controller-dock{display:none;position:fixed;left:8px;right:8px;bottom:8px;padding:8px;border:1px solid #294565;border-radius:12px;background:rgba(6,17,31,.96);box-shadow:0 10px 28px rgba(0,0,0,.36);z-index:50}.controller-dock.show{display:grid;gap:7px}.controller-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.controller-dock button{min-height:44px;border:1px solid #294565;border-radius:8px;background:#101c2e;color:#fff;font-size:14px;font-weight:900}.controller-dock .t1{background:#174c8f;border-color:#4489dc}.controller-dock .t2{background:#9a5d00;border-color:#e59b24}.controller-dock .t3{background:#1f7844;border-color:#4abd77}.controller-dock .danger{background:#32191d;border-color:#783d3d;color:#ffb0b0}.controller-note{text-align:center;color:#9fb0c7;font-size:11px;font-weight:800}
@media(max-width:760px){.remote-bar{gap:7px;padding:7px 8px}.remote-brand{width:100%;font-size:13px}.remote-status{order:5;margin-left:0;width:100%;justify-content:center}.game-frame{height:calc(100vh - 102px)}.controller-dock.show{bottom:6px}.controller-row{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="remote-bar">
  <div class="remote-brand">도전 바이블 <b>원격 테스트</b></div>
  <label class="remote-field">역할
    <select id="role"><option value="display">방송 화면</option><option value="controller">사회자</option></select>
  </label>
  <label class="remote-field">방
    <input id="room" value="BIBLE01" maxlength="32" autocomplete="off">
  </label>
  <button class="remote-connect off" id="connect" type="button">연결</button>
  <div class="remote-status" id="status">연결 안 됨</div>
</header>
<div class="frame-wrap"><iframe id="game" class="game-frame" src="./index.html" allowfullscreen></iframe></div>
<div class="controller-dock" id="dock">
  <div class="controller-row"><button class="t1" data-team="1">1팀</button><button class="t2" data-team="2">2팀</button><button class="t3" data-team="3">3팀</button></div>
  <div class="controller-row"><button id="unclaim">팀 해제</button><button id="undo">되돌리기</button><button class="danger" id="reset">전체 리셋</button></div>
  <div class="controller-note">문제·정답·미디어는 각 기기의 기존 .bb4를 그대로 사용합니다.</div>
</div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {getDatabase,ref,set,onValue} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js';

const firebaseConfig={
  apiKey:'AIzaSyAB3YZfk2xUbZC90i3hlBeVYUXXa9vczsA',
  authDomain:'biblegoldenbell-remote.firebaseapp.com',
  databaseURL:'https://biblegoldenbell-remote-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:'biblegoldenbell-remote',
  storageBucket:'biblegoldenbell-remote.firebasestorage.app',
  messagingSenderId:'729731199303',
  appId:'1:729731199303:web:1e0d9a58765e7b5c029c62'
};
const app=initializeApp(firebaseConfig),db=getDatabase(app);
const frame=document.getElementById('game'),roleEl=document.getElementById('role'),roomEl=document.getElementById('room'),connectBtn=document.getElementById('connect'),statusEl=document.getElementById('status'),dock=document.getElementById('dock');
let connected=false,role='display',room='BIBLE01',unsubs=[],lastCommandId=null,displayState=null,undoState=null,lastControllerQuestion=null;
const touch=(navigator.maxTouchPoints||0)>0||matchMedia('(pointer:coarse)').matches;roleEl.value=touch?'controller':'display';

function cleanRoom(v){return (String(v||'BIBLE01').toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,32)||'BIBLE01')}
function status(text,cls=''){statusEl.textContent=text;statusEl.className='remote-status '+cls}
function gameWindow(){return frame.contentWindow}function gameDoc(){try{return frame.contentDocument||frame.contentWindow.document}catch{return null}}
function readLocalJson(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}}
function packFingerprint(){const state=readLocalJson('bb4_state_v3')||{};const qs=Array.isArray(state.questions)?state.questions:[];const data=qs.map(q=>({n:q.number,t:q.type,a:q.answerType,q:q.question,a1:q.answer,h:q.hint,c:q.choices,cc:q.correctChoice,ox:q.oxAnswer,m:q.media,mn:q.mediaNames}));const str=JSON.stringify(data);let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return ('00000000'+(h>>>0).toString(16)).slice(-8)}
function progress(){return readLocalJson('bb4_progress_v3')||{owners:Array(16).fill(0),visited:Array(16).fill(false),lastQuestion:null}}
function mode(){return String((readLocalJson('bb4_state_v3')||{}).settings?.mode||'3')}
function currentDomState(){const d=gameDoc();const answer=!!d?.querySelector('#answerBtn')&&String(d.querySelector('#answerBtn')?.textContent||'').includes('문제 다시 보기');let view='home';if(d?.querySelector('.question-view'))view='question';else if(d?.querySelector('.admin-shell'))view='admin';return {view,answerVisible:answer}}
function updateDock(){dock.classList.toggle('show',connected&&role==='controller');const m=displayState?.mode||mode();dock.querySelector('[data-team="3"]').disabled=m!=='3';dock.querySelector('[data-team="2"]').disabled=m==='individual';dock.querySelector('[data-team="1"]').disabled=m==='individual'}
function controllerReady(show=true){if(!connected||role!=='controller'){if(show)status('사회자 역할로 연결하세요','warn');return false}if(!displayState){if(show)status(`${room} · 방송 화면 대기 중`,'warn');return false}if(displayState.packFingerprint!==packFingerprint()){if(show)status(`${room} · 문제팩 불일치`,'bad');return false}return true}
async function sendCommand(action,payload={}){if(!controllerReady())return false;const cmd={id:`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,action,payload,packFingerprint:packFingerprint(),sentAt:Date.now()};await set(ref(db,`rooms/${room}/command`),cmd);status(`${room} · 명령 전송됨`,'ok');return true}
async function publishDisplayState(){if(!connected||role!=='display')return;const p=progress(),ds=currentDomState();const payload={packFingerprint:packFingerprint(),mode:mode(),currentView:ds.view,answerVisible:ds.answerVisible,updatedAt:Date.now(),progress:{owners:Array.from(p.owners||[]),visited:Array.from(p.visited||[]),lastQuestion:p.lastQuestion}};await set(ref(db,`rooms/${room}/state`),payload);displayState=payload;status(`${room} · TV/PC 수신 대기`,'ok')}
function waitFor(selector,timeout=1600){return new Promise(resolve=>{const start=Date.now();const tick=()=>{const el=gameDoc()?.querySelector(selector);if(el)return resolve(el);if(Date.now()-start>timeout)return resolve(null);setTimeout(tick,35)};tick()})}
async function goBoard(){const d=gameDoc();const b=d?.querySelector('#boardBtn,#quickBoardBtn');if(b){b.click();await new Promise(r=>setTimeout(r,90));return true}return !!d?.querySelector('[data-cell]')}
async function applyCommand(cmd){if(!cmd||cmd.packFingerprint!==packFingerprint()){status(`${room} · 문제팩 불일치 명령 무시`,'bad');await publishDisplayState();return}const a=cmd.action,p=cmd.payload||{},d=gameDoc();if(!d)return;
  if(a==='OPEN_QUESTION'){await goBoard();const cell=await waitFor(`[data-cell="${Math.max(0,Math.min(15,Number(p.index)||0))}"]`);cell?.click()}
  else if(a==='SET_ANSWER'){const b=await waitFor('#answerBtn');if(b){const isAnswer=String(b.textContent||'').includes('문제 다시 보기');if(isAnswer!==!!p.visible)b.click()}}
  else if(a==='BOARD'){await goBoard()}
  else if(a==='ASSIGN_TEAM'){const pr=progress(),idx=pr.lastQuestion;if(idx!=null)undoState={index:idx,previous:Number(pr.owners?.[idx]||0)};await goBoard();const b=await waitFor(`[data-team="${Number(p.team)||1}"]`);b?.click()}
  else if(a==='UNCLAIM'){await goBoard();const pr=progress(),idx=pr.lastQuestion;if(idx!=null){const miss=await waitFor('[data-mini-action="miss"]');miss?.click();await new Promise(r=>setTimeout(r,35));gameDoc()?.querySelector(`[data-mini-cell="${idx}"]`)?.click()}}
  else if(a==='UNDO'){await goBoard();if(undoState){const sel=undoState.previous>0?String(undoState.previous):'miss';gameDoc()?.querySelector(`[data-mini-action="${sel}"]`)?.click();await new Promise(r=>setTimeout(r,35));gameDoc()?.querySelector(`[data-mini-cell="${undoState.index}"]`)?.click();undoState=null}}
  else if(a==='RESET'){await goBoard();gameDoc()?.querySelector('#resetProgress')?.click();const c=await waitFor('#resetConfirm');c?.click()}
  await new Promise(r=>setTimeout(r,150));await publishDisplayState();
}
function detach(){unsubs.forEach(fn=>{try{fn()}catch{}});unsubs=[];connected=false;displayState=null;lastCommandId=null;undoState=null;connectBtn.textContent='연결';connectBtn.classList.add('off');status('연결 안 됨');updateDock()}
async function attach(){detach();role=roleEl.value;room=cleanRoom(roomEl.value);roomEl.value=room;connected=true;connectBtn.textContent='연결 끊기';connectBtn.classList.remove('off');status(`${room} · 연결 중…`,'warn');
  if(role==='display'){let first=true;const u=onValue(ref(db,`rooms/${room}/command`),snap=>{const cmd=snap.val();if(first){first=false;lastCommandId=cmd?.id||null;publishDisplayState();return}if(!cmd?.id||cmd.id===lastCommandId)return;lastCommandId=cmd.id;applyCommand(cmd).catch(e=>{console.error(e);status('명령 처리 오류','bad')})},e=>{console.error(e);status('Firebase 연결 오류','bad')});unsubs.push(u);await publishDisplayState()}
  else{const u=onValue(ref(db,`rooms/${room}/state`),snap=>{displayState=snap.val()||null;if(!displayState)status(`${room} · 방송 화면 대기 중`,'warn');else if(displayState.packFingerprint!==packFingerprint())status(`${room} · 문제팩 불일치`,'bad');else status(`${room} · 방송 화면 연결됨 · 문제팩 일치`,'ok');updateDock()},e=>{console.error(e);status('Firebase 연결 오류','bad')});unsubs.push(u)}updateDock()}
connectBtn.addEventListener('click',()=>connected?detach():attach());roleEl.addEventListener('change',()=>{if(connected)attach();else updateDock()});roomEl.addEventListener('change',()=>{roomEl.value=cleanRoom(roomEl.value);if(connected)attach()});

dock.querySelectorAll('[data-team]').forEach(b=>b.addEventListener('click',()=>sendCommand('ASSIGN_TEAM',{team:Number(b.dataset.team)})));document.getElementById('unclaim').addEventListener('click',()=>sendCommand('UNCLAIM'));document.getElementById('undo').addEventListener('click',()=>sendCommand('UNDO'));document.getElementById('reset').addEventListener('click',()=>{if(confirm('문제 사용 표시와 팀 색을 모두 초기화할까요?'))sendCommand('RESET')});

frame.addEventListener('load',()=>{const d=gameDoc();if(!d)return;d.addEventListener('click',e=>{const t=e.target instanceof gameWindow().Element?e.target.closest('button'):null;if(!t)return;if(role==='controller'&&connected){if(t.matches('[data-mobile-preview]')){lastControllerQuestion=Number(t.dataset.mobilePreview);sendCommand('OPEN_QUESTION',{index:lastControllerQuestion})}else if(t.id==='mobileAnswerToggle'){const next=String(t.textContent||'').includes('정답 보기');sendCommand('SET_ANSWER',{visible:next})}else if(t.id==='mobileBackToBoard')sendCommand('BOARD')}else if(role==='display'&&connected){setTimeout(()=>publishDisplayState(),180)}},true);if(connected&&role==='display')setTimeout(()=>publishDisplayState(),250)});
updateDock();
</script>
</body>
</html>
