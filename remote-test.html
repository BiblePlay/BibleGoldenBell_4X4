<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06111f">
<title>BibleGoldenBell 4X4 · Remote Test v2</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  color:#f7f8fa;background:#06111f
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#06111f}
body{display:flex;flex-direction:column}
.remote-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 12px;border-bottom:1px solid #183453;background:#081522;color:#f7f8fa;z-index:10
}
.remote-brand{font-weight:900;white-space:nowrap}.remote-brand b{color:#ff9000}
.remote-field{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#aab7c8}
.remote-field input,.remote-field select{
  height:34px;border:1px solid #294565;border-radius:7px;background:#0b1928;color:#fff;
  padding:0 9px;font-size:14px;font-weight:800
}
.remote-field input{width:112px;text-transform:uppercase}
.remote-connect{
  height:34px;padding:0 13px;border:0;border-radius:7px;background:#ff9000;color:#07111d;font-weight:950;cursor:pointer
}
.remote-connect.off{background:#27384c;color:#dce6f2}
.remote-status{
  margin-left:auto;min-height:30px;display:flex;align-items:center;gap:7px;padding:0 10px;
  border:1px solid #294565;border-radius:999px;color:#9fb0c7;font-size:12px;font-weight:850;white-space:nowrap
}
.remote-status:before{content:'';width:8px;height:8px;border-radius:50%;background:#718096}
.remote-status.ok:before{background:#43d17a}.remote-status.warn:before{background:#ffb14d}.remote-status.bad:before{background:#ff6868}

.frame-wrap{position:relative;flex:1;min-height:0}
.game-frame{display:block;width:100%;height:calc(100vh - 53px);border:0;background:#06111f}

/* v2: 첫 검증용. 팀/리셋 기능은 의도적으로 넣지 않음 */
.controller-panel{
  display:none;
  position:fixed;left:8px;right:8px;bottom:8px;
  padding:10px;border:1px solid #294565;border-radius:12px;
  background:rgba(6,17,31,.97);box-shadow:0 10px 28px rgba(0,0,0,.36);z-index:50
}
.controller-panel.show{display:block}
.controller-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px
}
.controller-title{font-size:13px;font-weight:950}
.controller-mode{
  padding:4px 8px;border:1px solid #294565;border-radius:999px;
  color:#c7d2e1;font-size:11px;font-weight:900
}
.remote-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px
}
.remote-grid button{
  min-height:48px;border:1px solid #315474;border-radius:9px;
  background:#0b1b2f;color:#fff;font-size:18px;font-weight:950;cursor:pointer
}
.remote-grid button:active{background:#17314a;border-color:#ff9000}
.controller-note{
  margin-top:7px;text-align:center;color:#9fb0c7;font-size:11px;font-weight:800
}

@media(max-width:760px){
  .remote-bar{gap:7px;padding:7px 8px}
  .remote-brand{width:100%;font-size:13px}
  .remote-status{order:5;margin-left:0;width:100%;justify-content:center}
  .game-frame{height:calc(100vh - 102px)}
  .controller-panel.show{bottom:6px}
}
</style>
</head>
<body>

<header class="remote-bar">
  <div class="remote-brand">도전 바이블 <b>원격 테스트 v2</b></div>

  <label class="remote-field">역할
    <select id="role">
      <option value="display">방송 화면</option>
      <option value="controller">사회자</option>
    </select>
  </label>

  <label class="remote-field">방
    <input id="room" value="BIBLE01" maxlength="32" autocomplete="off">
  </label>

  <button class="remote-connect off" id="connect" type="button">연결</button>
  <div class="remote-status" id="status">연결 안 됨</div>
</header>

<div class="frame-wrap">
  <iframe id="game" class="game-frame" src="./index.html" allowfullscreen></iframe>
</div>

<section class="controller-panel" id="controllerPanel" aria-label="원격 문제 선택">
  <div class="controller-head">
    <div class="controller-title">원격 문제 선택</div>
    <div class="controller-mode" id="modeBadge">모드 확인 중</div>
  </div>
  <div class="remote-grid" id="remoteGrid"></div>
  <div class="controller-note">첫 검증 단계: 문제 선택만 원격 전송합니다. 팀·리셋 기능은 아직 넣지 않았습니다.</div>
</section>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {getDatabase,ref,set,onValue} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js';

const firebaseConfig={
  apiKey:'AIzaSyAB3YZfk2xUbZC90i3hlBeVYUXXa9vczsA',
  authDomain:'biblegoldenbell-remote.firebaseapp.com',
  databaseURL:'https://biblegoldenbell-remote-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:'biblegoldenbell-remote',
  storageBucket:'biblegoldenbell-remote.firebasestorage.app',
  messagingSenderId:'729731199303',
  appId:'1:729731199303:web:1e0d9a58765e7b5c029c62'
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const frame=document.getElementById('game');
const roleEl=document.getElementById('role');
const roomEl=document.getElementById('room');
const connectBtn=document.getElementById('connect');
const statusEl=document.getElementById('status');
const controllerPanel=document.getElementById('controllerPanel');
const remoteGrid=document.getElementById('remoteGrid');
const modeBadge=document.getElementById('modeBadge');

let connected=false;
let role='display';
let room='BIBLE01';
let unsubs=[];
let lastCommandId=null;
let displayState=null;
let lastPublishedFingerprint='';
let pollTimer=null;

const touch=(navigator.maxTouchPoints||0)>0||matchMedia('(pointer:coarse)').matches;
roleEl.value=touch?'controller':'display';

for(let i=0;i<16;i++){
  const b=document.createElement('button');
  b.type='button';
  b.textContent=String(i+1);
  b.dataset.remoteQuestion=String(i);
  b.addEventListener('click',()=>sendOpenQuestion(i));
  remoteGrid.appendChild(b);
}

function cleanRoom(v){
  return (String(v||'BIBLE01').toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,32)||'BIBLE01');
}
function status(text,cls=''){
  statusEl.textContent=text;
  statusEl.className='remote-status '+cls;
}
function gameDoc(){
  try{return frame.contentDocument||frame.contentWindow.document}catch{return null}
}
function readLocalJson(key){
  try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}
}
function currentMode(){
  const s=readLocalJson('bb4_state_v3')||{};
  const m=String(s.settings?.mode||s.settings?.gameMode||'3');
  return ['individual','2','3'].includes(m)?m:'3';
}
function modeLabel(m){
  return m==='individual'?'개인':m==='2'?'2팀':'3팀';
}

/* 문제팩 일치 확인용.
   미디어 Blob 자체는 제외하고 문제/정답/파일명 중심으로만 비교한다. */
function packFingerprint(){
  const state=readLocalJson('bb4_state_v3')||{};
  const qs=Array.isArray(state.questions)?state.questions:[];
  const data=qs.map(q=>({
    n:q.number,
    t:q.type,
    at:q.answerType,
    q:q.question,
    a:q.answer,
    h:q.hint,
    c:q.choices,
    cc:q.correctChoice,
    ox:q.oxAnswer,
    mn:q.mediaNames||{}
  }));
  const str=JSON.stringify(data);
  let h=2166136261;
  for(let i=0;i<str.length;i++){
    h^=str.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return ('00000000'+(h>>>0).toString(16)).slice(-8);
}

function progress(){
  return readLocalJson('bb4_progress_v3')||{
    owners:Array(16).fill(0),
    visited:Array(16).fill(false),
    lastQuestion:null
  };
}

function updateControllerPanel(){
  controllerPanel.classList.toggle('show',connected&&role==='controller');
  const m=displayState?.mode||currentMode();
  modeBadge.textContent=`현재 ${modeLabel(m)} 모드`;
}

function controllerReady(show=true){
  if(!connected||role!=='controller'){
    if(show)status('사회자 역할로 연결하세요','warn');
    return false;
  }
  if(!displayState){
    if(show)status(`${room} · 방송 화면 대기 중`,'warn');
    return false;
  }
  const mine=packFingerprint();
  if(displayState.packFingerprint!==mine){
    if(show)status(`${room} · 문제팩 불일치 (${mine}/${displayState.packFingerprint})`,'bad');
    return false;
  }
  return true;
}

async function sendOpenQuestion(index){
  if(!controllerReady())return false;
  const cmd={
    id:`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
    action:'OPEN_QUESTION',
    payload:{index:Number(index)},
    packFingerprint:packFingerprint(),
    sentAt:Date.now()
  };
  await set(ref(db,`rooms/${room}/command`),cmd);
  status(`${room} · ${index+1}번 전송됨`,'ok');
  return true;
}

async function publishDisplayState(force=false){
  if(!connected||role!=='display')return;
  const fingerprint=packFingerprint();
  if(!force && fingerprint===lastPublishedFingerprint)return;

  const p=progress();
  const payload={
    packFingerprint:fingerprint,
    mode:currentMode(),
    updatedAt:Date.now(),
    progress:{
      owners:Array.from(p.owners||[]),
      visited:Array.from(p.visited||[]),
      lastQuestion:p.lastQuestion
    }
  };
  await set(ref(db,`rooms/${room}/state`),payload);
  lastPublishedFingerprint=fingerprint;
  displayState=payload;
  status(`${room} · TV/PC 수신 대기 · ${modeLabel(payload.mode)}`,'ok');
}

function waitFor(selector,timeout=1800){
  return new Promise(resolve=>{
    const start=Date.now();
    const tick=()=>{
      const el=gameDoc()?.querySelector(selector);
      if(el)return resolve(el);
      if(Date.now()-start>timeout)return resolve(null);
      setTimeout(tick,35);
    };
    tick();
  });
}

async function goBoard(){
  const d=gameDoc();
  const board=d?.querySelector('#boardBtn,#quickBoardBtn');
  if(board){
    board.click();
    await new Promise(r=>setTimeout(r,100));
    return true;
  }
  return !!d?.querySelector('[data-cell]');
}

async function applyCommand(cmd){
  if(!cmd)return;

  const mine=packFingerprint();
  if(cmd.packFingerprint!==mine){
    status(`${room} · 문제팩 불일치 명령 무시`,'bad');
    await publishDisplayState(true);
    return;
  }

  if(cmd.action==='OPEN_QUESTION'){
    const index=Math.max(0,Math.min(15,Number(cmd.payload?.index)||0));
    await goBoard();
    const cell=await waitFor(`[data-cell="${index}"]`);
    if(!cell){
      status(`${room} · ${index+1}번 버튼을 찾지 못함`,'bad');
      return;
    }
    cell.click();
    status(`${room} · ${index+1}번 원격 실행`,'ok');
    await new Promise(r=>setTimeout(r,180));
    await publishDisplayState(true);
  }
}

function stopPolling(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null}
}
function startPolling(){
  stopPolling();
  pollTimer=setInterval(async()=>{
    if(!connected)return;
    if(role==='display'){
      const fp=packFingerprint();
      if(fp!==lastPublishedFingerprint){
        try{await publishDisplayState(true)}catch{}
      }
    }else if(role==='controller'&&displayState){
      const mine=packFingerprint();
      if(displayState.packFingerprint===mine){
        status(`${room} · 방송 화면 연결됨 · 문제팩 일치`,'ok');
      }else{
        status(`${room} · 문제팩 불일치 (${mine}/${displayState.packFingerprint})`,'bad');
      }
      updateControllerPanel();
    }
  },1000);
}

function detach(){
  unsubs.forEach(fn=>{try{fn()}catch{}});
  unsubs=[];
  stopPolling();
  connected=false;
  displayState=null;
  lastCommandId=null;
  lastPublishedFingerprint='';
  connectBtn.textContent='연결';
  connectBtn.classList.add('off');
  status('연결 안 됨');
  updateControllerPanel();
}

async function attach(){
  detach();

  role=roleEl.value;
  room=cleanRoom(roomEl.value);
  roomEl.value=room;
  connected=true;

  connectBtn.textContent='연결 끊기';
  connectBtn.classList.remove('off');
  status(`${room} · 연결 중…`,'warn');

  if(role==='display'){
    let first=true;
    const u=onValue(
      ref(db,`rooms/${room}/command`),
      snap=>{
        const cmd=snap.val();
        if(first){
          first=false;
          lastCommandId=cmd?.id||null;
          publishDisplayState(true);
          return;
        }
        if(!cmd?.id||cmd.id===lastCommandId)return;
        lastCommandId=cmd.id;
        applyCommand(cmd).catch(e=>{
          console.error(e);
          status('명령 처리 오류','bad');
        });
      },
      e=>{
        console.error(e);
        status('Firebase 연결 오류','bad');
      }
    );
    unsubs.push(u);
    await publishDisplayState(true);
  }else{
    const u=onValue(
      ref(db,`rooms/${room}/state`),
      snap=>{
        displayState=snap.val()||null;
        if(!displayState){
          status(`${room} · 방송 화면 대기 중`,'warn');
        }else if(displayState.packFingerprint!==packFingerprint()){
          status(`${room} · 문제팩 불일치 (${packFingerprint()}/${displayState.packFingerprint})`,'bad');
        }else{
          status(`${room} · 방송 화면 연결됨 · 문제팩 일치`,'ok');
        }
        updateControllerPanel();
      },
      e=>{
        console.error(e);
        status('Firebase 연결 오류','bad');
      }
    );
    unsubs.push(u);
  }

  startPolling();
  updateControllerPanel();
}

connectBtn.addEventListener('click',()=>connected?detach():attach());
roleEl.addEventListener('change',()=>{if(connected)attach();else updateControllerPanel()});
roomEl.addEventListener('change',()=>{
  roomEl.value=cleanRoom(roomEl.value);
  if(connected)attach();
});

/* 기존 휴대폰 미리보기의 1~16 버튼도 그대로 원격 명령으로 사용.
   이벤트 위임을 iframe document에 걸어 화면이 다시 렌더링되어도 유지한다. */
function installIframeBridge(){
  const d=gameDoc();
  if(!d||d.documentElement.dataset.remoteBridgeInstalled==='1')return;
  d.documentElement.dataset.remoteBridgeInstalled='1';

  d.addEventListener('click',e=>{
    if(!connected)return;

    if(role==='controller'){
      const target=e.target?.nodeType===1 ? e.target : e.target?.parentElement;
      const btn=target?.closest?.('[data-mobile-preview]');
      if(btn){
        const index=Number(btn.getAttribute('data-mobile-preview'));
        if(Number.isInteger(index))sendOpenQuestion(index);
      }
    }

    if(role==='display'){
      setTimeout(()=>publishDisplayState(true),220);
    }
  },true);
}

frame.addEventListener('load',()=>{
  installIframeBridge();
  if(connected&&role==='display')setTimeout(()=>publishDisplayState(true),300);
});

/* index.html 내부는 iframe navigation 없이 자체 렌더링되므로,
   브리지가 빠질 가능성을 막기 위해 가볍게 재확인한다. */
setInterval(installIframeBridge,1200);

updateControllerPanel();
</script>
</body>
</html>
