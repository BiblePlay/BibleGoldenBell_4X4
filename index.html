.topbar-actions{display:flex;gap:6px}.icon-button{width:34px;height:34px;display:grid;place-items:center;color:var(--text);border:1px solid #24476c;border-radius:8px;background:#081827;font-weight:900}.icon-button:hover{color:var(--accent);border-color:var(--accent)}

.master-board-titlebar{display:flex;align-items:flex-start;justify-content:space-between}.master-board-title{position:relative;padding-bottom:16px;display:flex;align-items:baseline;gap:9px}.master-board-title:after{content:"";position:absolute;left:0;bottom:4px;width:42px;height:3px;background:var(--accent)}
.master-board-title span,.master-board-title strong{font-size:32px;line-height:1;letter-spacing:-.05em;font-weight:900}.master-board-title strong{color:var(--accent)}
.master-admin-button{height:43px;padding:0 15px;display:inline-flex;align-items:center;gap:8px;color:var(--text);border:1px solid #24476c;border-radius:10px;background:transparent;font-size:14px;font-weight:800}.master-admin-button:hover{border-color:var(--accent);color:var(--accent)}

.master-score-cell:hover:not(:disabled):not(.is-played):not(.is-claimed){color:#07111d;background:var(--accent-hover);border-color:var(--accent-hover)}
.master-score-cell.is-played:not(.is-claimed){color:#aeb4bf;border-color:#687180;background:linear-gradient(180deg,#303846,#252c37)}

.master-score-cell.team-1{border-color:#f4a11a;background:linear-gradient(145deg,#b76b00,#7d4700)}.master-score-cell.team-2{border-color:#4e9be8;background:linear-gradient(145deg,#246ba8,#16456f)}.master-score-cell.team-3{border-color:#8f7ee8;background:linear-gradient(145deg,#6252b5,#40347f)}
.master-score-cell.is-bingo-cell{box-shadow:inset 0 0 0 3px rgba(255,255,255,.72),0 0 0 2px rgba(255,255,255,.2),0 0 30px rgba(255,255,255,.24)}.master-score-cell.is-pending:not(.is-claimed){box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}

.master-sidebar{min-width:0;min-height:0;display:grid;border:2px solid var(--line);border-radius:0 16px 16px 0;overflow:hidden;grid-template-rows:clamp(170px,23vh,250px) minmax(0,1fr)}
.master-logo-panel{padding:15px 26px;display:grid;place-items:center;background:var(--bg)}.master-logo-panel img{width:100%;max-height:235px;object-fit:contain}
.bingo-control-panel{min-height:0;margin:0 22px 22px;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;align-content:start;gap:14px;border:1px solid #1a3a5e;border-radius:12px;background:#06111f;overflow:hidden}
.bingo-control-heading{height:58px;padding:0 18px;display:flex;align-items:center;gap:10px;color:var(--text);background:#0c2d50;font-size:19px;line-height:1;font-weight:900}.live-dot{width:14px;height:14px;flex:0 0 14px;border-radius:999px;background:#ff1b1b}
.bingo-mode-buttons{padding:0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bingo-mode-buttons button{height:42px;color:#d6dce5;border:1px solid #294867;border-radius:9px;background:#0a1928;font-size:14px;font-weight:900}.bingo-mode-buttons button:hover,.bingo-mode-buttons button.is-active{color:#07111d;border-color:var(--accent);background:var(--accent)}

.bingo-team-buttons{min-height:0;padding:0 16px;display:grid;align-content:start;gap:10px}.bingo-team-buttons button{min-height:66px;padding:0 18px;display:grid;grid-template-columns:26px 1fr;align-items:center;gap:12px;color:#f7f8fa;border:1px solid #294867;border-radius:11px;background:#0a1928;font-size:20px;text-align:left}.bingo-team-buttons button:disabled{opacity:.35;cursor:not-allowed}.team-color-dot{width:20px;height:20px;display:block;border-radius:999px;box-shadow:0 0 0 4px rgba(255,255,255,.06)}.team-one .team-color-dot{background:var(--team1)}.team-two .team-color-dot{background:var(--team2)}.team-three .team-color-dot{background:var(--team3)}
.bingo-secondary-actions{padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bingo-secondary-actions button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#c6ced9;border:1px solid #294867;border-radius:8px;background:#081827;font-size:13px;font-weight:800}.bingo-secondary-actions button:disabled{opacity:.32;cursor:not-allowed}.bingo-secondary-actions button:not(:disabled):hover{color:var(--accent);border-color:var(--accent)}
/* question screen */
.event-shell{height:100vh;overflow:hidden;background:var(--bg)}.question-wrap{height:calc(100vh - 50px);padding:10px;overflow:hidden}.question-view{height:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:22px 28px;display:flex;flex-direction:column;overflow:hidden}.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;font-weight:900}.qmeta .orange{color:var(--accent);letter-spacing:.08em}.question-body{min-height:0;flex:1;display:flex;flex-direction:column;justify-content:center;overflow:auto;padding:12px 12px 0}.question-text{width:100%;max-width:1180px;margin:0 auto 18px;text-align:center;color:#fff;font-size:clamp(40px,5.4vw,82px);line-height:1.12;font-weight:950;letter-spacing:-.055em;white-space:pre-wrap;word-break:keep-all}.question-text.medium{font-size:clamp(32px,4.2vw,62px)}.question-text.long{font-size:clamp(25px,3.3vw,48px)}
.hint{max-width:930px;margin:0 auto 13px;padding:9px 14px;border:1px solid #294565;border-radius:8px;color:#ffb14d;background:#0b1928;text-align:center;font-size:14px;font-weight:800}.media-stage{width:100%;min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden;margin:0 auto 14px}.media-stage img,.answer-media img{max-width:100%;max-height:52vh;object-fit:contain;border-radius:10px;background:#050c15}.media-stage video{max-width:100%;max-height:52vh;border-radius:10px;background:#000}.audio-card{width:min(760px,100%);padding:14px;border:1px solid #294565;border-radius:10px;background:#0b1928}.audio-card audio{width:100%}
.choices{width:min(1120px,100%);display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 auto 16px}.choice{min-height:78px;padding:13px 18px;display:flex;align-items:center;gap:10px;border:1px solid #294565;border-radius:10px;background:#101c2e;font-size:clamp(19px,2vw,30px);font-weight:900}.choice .n{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:7px;color:#07111d;background:var(--accent);font-size:17px}.ox{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 auto 18px}.ox div{height:190px;display:grid;place-items:center;border:2px solid #35516f;border-radius:18px;background:#101c2e;font-size:112px;font-weight:950}.ox .o{color:#64a8ff}.ox .x{color:#ff6d7e}

/* ADMIN — local screenshot composition */
.admin-shell{height:100vh;overflow:hidden;color:#172033;background:#f4f6f9}.admin-scroll-area{height:calc(100vh - 50px);padding:18px;overflow-y:auto;background:#f4f6f9}.admin-panel{width:min(1180px,100%);margin:0 auto;padding:28px;color:#172033;border:1px solid #d9dee7;border-radius:12px;background:#fff}.admin-header{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px}.admin-header span.kicker{color:#ff730f;font-size:12px;font-weight:900;letter-spacing:.14em}.admin-header h1{margin:4px 0;color:#0e3166;font-size:40px}.admin-header p{margin:0;color:#6b7280}.admin-header-actions{display:flex;align-items:flex-start;gap:8px}.admin-primary-button,.admin-secondary-button{padding:10px 14px;display:inline-flex;align-items:center;gap:7px;border-radius:8px;font-weight:800}.admin-primary-button{color:#fff;border:0;background:#ff730f}.admin-secondary-button{color:#0e3166;border:1px solid #d9dee7;background:#fff}
.admin-layout{display:grid;grid-template-columns:286px minmax(0,1fr);gap:22px}.admin-nav{padding:16px;border:1px solid #d9dee7;border-radius:10px;background:#eaf0f8}.admin-nav-kicker{color:#ff730f;font-size:11px;font-weight:900;letter-spacing:.14em}.admin-nav-title{margin-top:4px;color:#0e3166;font-size:26px;line-height:1;font-weight:900}.admin-slot-label{margin:16px 0 8px;color:#0e3166;font-weight:800}.admin-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.admin-slots button{min-height:0;aspect-ratio:1/1;display:grid;place-items:center;color:#0e3166;border:1px solid #d9dee7;border-radius:8px;background:#fff;font-size:17px;font-weight:900}.admin-slots button.is-filled{border-color:#ffb980}.admin-slots button.is-selected{color:#fff;border-color:#ff730f;background:#ff730f}
.admin-form{min-width:0}.admin-form-title{color:#0e3166;font-size:24px;font-weight:900;margin-bottom:14px}.admin-workspace{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,32vw,430px);gap:22px;align-items:start;min-width:0}.admin-editor{min-width:0;display:grid;gap:18px}.admin-preview{position:sticky;top:12px;width:100%;min-width:0;max-width:430px;max-height:calc(100vh - 96px);padding:14px;display:grid;align-content:start;gap:10px;overflow:auto;border:1px solid #d9dee7;border-radius:12px;background:#f4f6f9}.preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.preview-head strong{color:#172033}.preview-tabs{display:flex;gap:6px}.preview-tab{height:36px;padding:0 14px;border:1px solid #c9d0dc;border-radius:7px;background:#fff;color:#0e3166;font-weight:800}.preview-tab.active{color:#fff;border-color:#ff730f;background:#ff730f}.preview-screen{width:100%;aspect-ratio:16/9;padding:14px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:9px;overflow:hidden;color:#fff;border-radius:10px;background:linear-gradient(180deg,#0e1d33,#07111f)}.preview-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#9fb0c7;font-size:11px;font-weight:800}.preview-body{min-height:0;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:8px;overflow:hidden}.preview-media{width:100%;min-height:0;flex:1 1 auto;display:grid;place-items:center;overflow:hidden;border-radius:7px;background:#050c15}.preview-media img,.preview-media video{width:100%;height:100%;max-height:100%;object-fit:contain}.preview-text{width:100%;flex:0 0 auto;max-height:34%;overflow:hidden;color:#fff;font-size:20px;line-height:1.22;font-weight:900;text-align:center;word-break:keep-all;overflow-wrap:anywhere}.preview-text.with-image{max-height:25%;padding:2px 4px 0;font-size:14px}.preview-hint{width:100%;overflow:hidden;color:#ffb14d;font-size:11px;line-height:1.25;text-align:center;white-space:nowrap;text-overflow:ellipsis}.preview-choice-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:5px}.preview-choice{min-height:30px;padding:5px 7px;display:flex;align-items:center;gap:6px;overflow:hidden;border:1px solid #294565;border-radius:6px;background:#101c2e;font-size:10px;line-height:1.15;font-weight:800}.preview-choice-number{width:18px;height:18px;flex:0 0 18px;display:grid;place-items:center;color:#07111f;border-radius:4px;background:#ff9000;font-size:9px}.preview-score{justify-self:end;color:#ff9000;font-size:15px;font-weight:900}
.admin-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.admin-field{display:grid;gap:7px}.admin-field.full{grid-column:1/-1}.admin-field>span,.admin-section-title{color:#0e3166;font-weight:800}.admin-field select,.admin-field input,.admin-field textarea{width:100%;color:#172033;border:1px solid #c9d0dc;border-radius:8px;background:#fff}.admin-field select,.admin-field input{height:44px;padding:0 12px}.admin-field textarea{min-height:122px;padding:12px;resize:vertical;line-height:1.45}.admin-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.admin-choices>span{grid-column:1/-1;color:#0e3166;font-weight:800}.admin-choice{display:grid;grid-template-columns:32px minmax(0,1fr);align-items:center;gap:8px}.admin-choice strong{width:30px;height:30px;display:grid;place-items:center;color:#fff;background:#0e3166;border-radius:7px}.admin-choice input{height:44px;padding:0 12px;color:#172033;border:1px solid #c9d0dc;border-radius:8px;background:#fff}
.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.media-card{min-width:0;padding:12px;display:grid;gap:9px;border:1px solid #d9dee7;border-radius:10px;background:#fff}.media-card.is-drag{border-color:#ff730f;box-shadow:0 0 0 3px rgba(255,115,15,.12)}.media-card-title{display:flex;align-items:center;justify-content:space-between;color:#0e3166;font-weight:900}.media-drop{height:150px;display:grid;place-items:center;overflow:hidden;border:1px dashed #bcc7d5;border-radius:8px;background:#eaf0f8;color:#6b7280;text-align:center;padding:8px}.media-drop img{width:100%;height:100%;object-fit:contain}.media-drop video{width:100%;height:100%;object-fit:contain}.media-drop .bigicon{font-size:34px;color:#7d8998}.media-drop small{display:block;margin-top:5px;line-height:1.45}.media-filename{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#6b7280;font-size:11px}.media-actions{display:flex;gap:7px}.media-actions label,.media-actions button{flex:1;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:7px;font-weight:800}.media-actions label{color:#fff;background:#0e3166}.media-actions input{display:none}.media-actions button{color:#b42318;border:1px solid #efc8bf;background:#fff}

/* Bingo celebration */

/* === FINAL FIX 2026-08-21: fullscreen persistence + original question/answer layout === */
:fullscreen body,
:fullscreen #app{width:100%;height:100%;overflow:hidden}
:fullscreen .master-screen{width:100%;height:100%;grid-template-columns:minmax(0,1fr) 382px}
:fullscreen .master-board-panel{
  padding:14px 22px 12px;
  grid-template-rows:58px minmax(0,1fr) 62px;
}
:fullscreen .master-board-grid-4x4{
  width:min(calc(100vw - 430px),calc(100vh - 138px));
  max-width:100%;
  max-height:100%;
}
:fullscreen .master-board-title span,
:fullscreen .master-board-title strong{font-size:30px}
:fullscreen .master-footer-actions button{height:48px}
:fullscreen .master-sidebar{grid-template-rows:clamp(145px,19vh,205px) minmax(0,1fr)}
:fullscreen .master-logo-panel{padding:10px 24px}
:fullscreen .master-logo-panel img{max-height:190px}

/* Original local question / answer composition: no metadata labels and no inner answer card */
.event-shell{height:100vh;overflow:hidden;background:var(--bg)}
.question-wrap{height:100vh;padding:0;overflow:hidden}
.question-view{
  height:100%;
  padding:16px;
  display:grid;
  grid-template-rows:40px minmax(0,1fr) 54px;
  gap:10px;
  overflow:hidden;
  background:var(--bg);
  border:0;
  border-radius:0;
}
.question-toolbar{
  display:flex;align-items:center;justify-content:space-between;
}
.question-toolbar button{
  min-width:104px;height:40px;padding:0 13px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  color:var(--text);border:1px solid #24476c;border-radius:8px;
  background:#081827;font-weight:800;
}
.question-toolbar button:hover{color:var(--accent);border-color:var(--accent)}
.question-toolbar > span{
  color:var(--accent);font-size:13px;font-weight:900;letter-spacing:.1em;
}
.question-stage{
  min-height:0;padding:10px 28px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
.question-stage.has-media{
  display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;
  align-items:stretch;
}
.question-stage.has-media.has-choices{
  grid-template-rows:minmax(0,1fr) auto auto;
}
.question-stage.hidden-stage{padding:2px}
.question-stage .media-stage{
  width:100%;height:100%;min-height:0;margin:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.question-stage .media-stage img,
.question-stage .media-stage video{
  width:100%;height:100%;max-width:100%;max-height:100%;
  object-fit:contain;border-radius:10px;background:#050c15;
}
.question-stage .audio-card{align-self:center}
.question-stage .question-text{
  width:100%;max-width:1160px;margin:0 auto;
  padding:0;text-align:center;color:#fff;
  font-size:clamp(48px,5.6vw,96px);line-height:1.14;font-weight:950;
  letter-spacing:-.055em;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;
}
.question-stage .question-text.medium{font-size:clamp(38px,4.4vw,72px)}
.question-stage .question-text.long{font-size:clamp(28px,3.4vw,54px)}
.question-stage.has-media .question-text{
  max-height:24vh;padding:8px 18px;overflow:hidden;line-height:1.22;
}
.question-stage .hint{
  margin:0 auto 10px;max-width:940px;padding:8px 14px;
}
.question-stage .choices{
  width:min(1120px,100%);margin:0 auto;
}
.question-stage .ox{
  width:min(820px,84%);margin:36px auto 0;gap:70px;
}
.question-stage .ox div{height:145px;font-size:86px}
.answer-direct{
  width:100%;height:100%;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;overflow:hidden;text-align:center;
}
.answer-direct .answer-text{
  width:100%;max-width:1160px;margin:0;padding:0;
  color:#fff;font-size:clamp(50px,5.5vw,92px);line-height:1.14;font-weight:950;
  letter-spacing:-.055em;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;
}
.answer-direct .answer-text.medium{font-size:clamp(38px,4.3vw,70px)}
.answer-direct .answer-text.long{font-size:clamp(28px,3.3vw,52px)}
.answer-direct .answer-media{
  width:100%;min-height:0;flex:1;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.answer-direct .answer-media img{
  width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;background:#050c15;
}
.answer-direct.ox-answer .ox-answer-symbol{
  font-size:min(38vw,420px);line-height:.9;font-weight:950;
}
.question-footer{display:flex;align-items:center;justify-content:center}
.question-footer button{
  min-width:210px;height:50px;display:inline-flex;align-items:center;justify-content:center;
  color:#07111d;border:0;border-radius:9px;background:var(--accent);
  font-size:17px;font-weight:900;
}
.question-footer button:hover{background:var(--accent-hover)}

/* In-app reset confirmation so fullscreen is not cancelled by browser confirm() */
.reset-modal-backdrop{
  position:fixed;inset:0;z-index:10050;display:grid;place-items:center;
  padding:24px;background:rgba(2,8,15,.72);backdrop-filter:blur(4px);
}
.reset-modal{
  width:min(430px,calc(100vw - 40px));padding:24px;
  border:1px solid #294867;border-radius:14px;background:#081827;
  box-shadow:0 24px 70px rgba(0,0,0,.45);color:#fff;
}
.reset-modal h3{margin:0 0 9px;font-size:22px}
.reset-modal p{margin:0;color:#9aa7b7;line-height:1.55}
.reset-modal-actions{margin-top:22px;display:flex;justify-content:flex-end;gap:9px}
.reset-modal-actions button{
  min-width:100px;height:42px;border-radius:8px;font-weight:850;
}
.reset-modal-actions .cancel{color:#fff;border:1px solid #294867;background:#0a1928}
.reset-modal-actions .confirm{color:#07111d;border:0;background:var(--accent)}

</style>

const TYPE_LABELS={general:'일반·초성·빈칸',ox:'OX',image:'그림퀴즈',person:'인물퀴즈',video:'영상퀴즈',hidden:'숨은그림찾기'};
const ANSWER_LABELS={short:'단답형',multiple:'4지선다'};
const TEAM_META={1:{name:'1팀',color:'#f4a11a'},2:{name:'2팀',color:'#4e9be8'},3:{name:'3팀',color:'#8f7ee8'}};
let adminIndex=0,adminPreviewMode='question',answerVisible=false,currentView='home',currentQuestion=0,autosaveTimer=null;
const mediaUrlCache=new Map();

function emptyQuestion(n){return {number:n,type:'general',answerType:'short',question:'',answer:'',hint:'',choices:['','','',''],correctChoice:0,oxAnswer:'O',hiddenShowText:false,audioPlayback:'manual',media:{questionImage:null,answerImage:null,video:null,audio:null},mediaNames:{}}}
function defaultState(){return {version:4,questions:Array.from({length:16},(_,i)=>emptyQuestion(i+1)),settings:{mode:'3'}}}
function defaultProgress(){return {owners:Array(16).fill(0),visited:Array(16).fill(false),lastQuestion:null,winning:[],lastClaim:null}}
function normalizeQuestion(raw,n){
  const b=emptyQuestion(n),q=raw&&typeof raw==='object'?raw:{};let type=q.type||'general',answerType=q.answerType||'short';
  if(type==='text'){type='general'}
  if(type==='multiple'){type='general';answerType='multiple'}
  if(type==='audio'){type='general'}
  if(!TYPE_LABELS[type]) type='general';
  if(type==='ox'){answerType='multiple'}
  if(!['short','multiple'].includes(answerType))answerType='short';
  const media={...b.media,...(q.media||{})};
  if(q.questionImageUrl&&!media.questionImage)media.questionImage=q.questionImageUrl;
  if(q.answerImageUrl&&!media.answerImage)media.answerImage=q.answerImageUrl;
  if(q.mediaUrl&&!media.video&&type==='video')media.video=q.mediaUrl;
  return {...b,...q,number:n,type,answerType,choices:Array.isArray(q.choices)?[...q.choices,...Array(4).fill('')].slice(0,4):b.choices,correctChoice:Number.isInteger(q.correctChoice)?q.correctChoice:0,oxAnswer:q.oxAnswer||((String(q.answer||'').includes('X'))?'X':'O'),hiddenShowText:!!q.hiddenShowText,audioPlayback:q.audioPlayback||(q.audioAuto?'auto':'manual'),media,mediaNames:{...b.mediaNames,...(q.mediaNames||{})}};
}
function normalizeState(raw){const d=defaultState(),s=raw&&typeof raw==='object'?raw:{};d.questions=Array.from({length:16},(_,i)=>normalizeQuestion((s.questions||[])[i],i+1));const mode=String(s.settings?.mode||s.settings?.gameMode||'3');d.settings.mode=['individual','2','3'].includes(mode)?mode:'3';return d}
function loadState(){try{const r=localStorage.getItem(LS_KEY);return r?normalizeState(JSON.parse(r)):defaultState()}catch{return defaultState()}}
function saveState(){localStorage.setItem(LS_KEY,JSON.stringify(state))}
function loadProgress(){try{const r=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null');if(!r)return defaultProgress();return {...defaultProgress(),...r,owners:[...(r.owners||[]),...Array(16).fill(0)].slice(0,16),visited:[...(r.visited||[]),...Array(16).fill(false)].slice(0,16),winning:Array.isArray(r.winning)?r.winning:[]}}catch{return defaultProgress()}}
function saveProgress(){localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress))}
let state=loadState(),progress=loadProgress();

function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
function qKey(n,kind){return `q${n}_${kind}`}
function dateStamp(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function crownSvg(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17h16l-1.3-9-4.2 4-2.5-6-2.5 6-4.2-4L4 17Z"/><path d="M5 20h14"/></svg>'}
function commonTopbar(){return `<header class="topbar"><button class="brand" id="brandHome"><span class="brand-mark">${crownSvg()}</span><span>도전 바이블 <strong>골든벨</strong></span></button><div class="topbar-actions"><button class="icon-button" id="gearBtn" title="관리자">⚙</button><button class="icon-button" id="topReset" title="전체 초기화">↻</button><button class="icon-button" id="topFullscreen" title="전체화면">⛶</button></div></header>`}
async function enterFullscreen(){try{await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch{await document.documentElement.requestFullscreen()}}

function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbPut(key,blob){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(blob,key);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>rej(tx.error)})}
async function dbGet(key){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readonly');const rq=tx.objectStore(DB_STORE).get(key);rq.onsuccess=()=>{db.close();res(rq.result||null)};rq.onerror=()=>rej(rq.error)})}
async function dbDelete(key){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(key);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>rej(tx.error)})}
async function dbClear(){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).clear();tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>rej(tx.error)})}
async function dbKeys(){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readonly');const rq=tx.objectStore(DB_STORE).getAllKeys();rq.onsuccess=()=>{db.close();res(rq.result||[])};rq.onerror=()=>rej(rq.error)})}
function revokeMedia(key){if(mediaUrlCache.has(key)){URL.revokeObjectURL(mediaUrlCache.get(key));mediaUrlCache.delete(key)}}
async function mediaUrl(ref){if(!ref)return null;if(/^data:|^blob:|^https?:|^\//.test(ref))return ref;if(mediaUrlCache.has(ref))return mediaUrlCache.get(ref);const b=await dbGet(ref);if(!b)return null;const u=URL.createObjectURL(b);mediaUrlCache.set(ref,u);return u}

  let teams='';for(let id=1;id<=teamCount;id++){teams+=`<button class="team-${id===1?'one':id===2?'two':'three'}" data-team="${id}" ${last==null?'disabled':''}><span class="team-color-dot"></span><strong>${id}팀</strong></button>`}
  const lower=teamCount?`<div class="bingo-pending-card"><span>방금 푼 문제</span><strong>${last==null?'—':last+1+'번'}</strong><p>${last==null?'문제를 푼 뒤 팀 색을 선택합니다.':'맞힌 팀의 색을 누르세요.'}</p></div><div class="bingo-team-buttons">${teams}</div><div class="bingo-secondary-actions"><button id="missBtn" ${last==null?'disabled':''}>미획득</button><button id="undoClaim" ${!progress.lastClaim?'disabled':''}>↶ 배정 취소</button></div>`:`<div class="bingo-solo-card"><strong>개인 문제판</strong><p>문제를 선택하고 정답을 확인하면 사용한 번호가 표시됩니다.</p></div>`;
  document.getElementById('app').innerHTML=`<main class="master-screen"><section class="master-board-panel"><header class="master-board-titlebar"><div class="master-board-title"><span>도전 바이블</span><strong>골든벨</strong></div><button class="master-admin-button" id="homeAdmin">⚙ 관리자 모드</button></header><div class="master-board-grid-4x4">${cells}</div><footer class="master-board-footer"><div class="master-footer-actions"><button id="resetProgress">↻ 전체 초기화</button><button id="homeFullscreen">↗ 전체화면</button></div></footer></section><aside class="master-sidebar"><section class="master-logo-panel"><img src="${LOGO_DATA}" alt="도전 바이블 골든벨"></section><section class="bingo-control-panel"><div class="bingo-control-heading"><span class="live-dot"></span>GAME MODE</div><div class="bingo-mode-buttons"><button data-mode="individual" class="${mode==='individual'?'is-active':''}">개인</button><button data-mode="2" class="${mode==='2'?'is-active':''}">2팀</button><button data-mode="3" class="${mode==='3'?'is-active':''}">3팀</button></div>${lower}</section></aside></main>`;
  document.querySelectorAll('[data-cell]').forEach(b=>b.addEventListener('click',()=>openQuestion(Number(b.dataset.cell))));
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{state.settings.mode=b.dataset.mode;saveState();renderHome()}));document.querySelectorAll('[data-team]').forEach(b=>b.addEventListener('click',()=>assignOwner(Number(b.dataset.team))));
  document.getElementById('homeAdmin').addEventListener('click',()=>{currentView='admin';render()});document.getElementById('resetProgress').addEventListener('click',resetProgress);document.getElementById('homeFullscreen').addEventListener('click',toggleFullscreen);document.getElementById('missBtn')?.addEventListener('click',()=>assignOwner(-1));document.getElementById('undoClaim')?.addEventListener('click',undoClaim);

async function resetProgress(){const ok=await showResetProgressDialog();if(!ok)return;const wanted=!!document.fullscreenElement;progress=defaultProgress();saveProgress();if(currentView==='home')renderHome();else toast('행사 진행 상태를 초기화했습니다.');if(wanted&&!document.fullscreenElement){try{await enterFullscreen()}catch{}}}
async function openQuestion(i){const wanted=!!document.fullscreenElement;currentQuestion=i;progress.lastQuestion=i;progress.visited[i]=true;saveProgress();answerVisible=false;currentView='question';await renderQuestion(i);if(wanted&&!document.fullscreenElement){try{await enterFullscreen()}catch{}}}
function assignOwner(team){const i=progress.lastQuestion;if(i==null){toast('먼저 문제를 하나 풀어주세요.');return}progress.lastClaim={index:i,previous:progress.owners[i]||0};progress.owners[i]=team;progress.winning=[];if(team>0){const line=findWinningLine(team);if(line)progress.winning=line}saveProgress();renderHome();if(progress.winning.length)setTimeout(()=>celebrate(team),90)}
function undoClaim(){if(!progress.lastClaim)return;const {index,previous}=progress.lastClaim;progress.owners[index]=previous;progress.winning=[];progress.lastClaim=null;saveProgress();renderHome()}
function findWinningLine(team){const lines=[];for(let r=0;r<4;r++)lines.push([r*4,r*4+1,r*4+2,r*4+3]);for(let c=0;c<4;c++)lines.push([c,c+4,c+8,c+12]);lines.push([0,5,10,15],[3,6,9,12]);return lines.find(line=>line.every(i=>progress.owners[i]===team))||null}
function celebrate(team){const meta=TEAM_META[team]||TEAM_META[1],ov=document.createElement('div');ov.className='bingo-celebration';let conf='';for(let i=0;i<80;i++){const colors=[meta.color,'#fff','#ffcf70','#43d17a','#6ca8ff'];conf+=`<i class="confetti-piece" style="left:${(i*37)%100}%;background:${colors[i%colors.length]};animation-delay:${(i%12)*.04}s;transform:rotate(${i*43%180}deg)"></i>`}ov.innerHTML=conf+`<div class="bingo-card"><span>${meta.name}</span><strong>BINGO!</strong></div>`;document.body.appendChild(ov);setTimeout(()=>ov.remove(),3250)}

async function renderQuestion(i){
  const q=state.questions[i]||emptyQuestion(i+1);
  const qImg=await mediaUrl(q.media.questionImage);
  const aImg=await mediaUrl(q.media.answerImage);
  const video=await mediaUrl(q.media.video);
  const audio=await mediaUrl(q.media.audio);

  let stage='';
  if(!answerVisible){
    const qt=(q.question||'').trim();
    const textSize=qt.length>90?'long':qt.length>50?'medium':'';
    const hasImage=['image','person','hidden'].includes(q.type)&&!!qImg;
    const hasVideo=q.type==='video'&&!!video;
    const hasAudio=!!audio;
    const hasMedia=hasImage||hasVideo||hasAudio;
    const hasChoices=q.type==='ox'||(q.answerType==='multiple'&&q.type!=='ox');

    if(q.type==='hidden'){
      let hidden='';
      if(qImg)hidden+=`<div class="media-stage"><img src="${qImg}" alt="숨은그림 문제"></div>`;
      if(q.hiddenShowText&&qt)hidden+=`<div class="question-text ${textSize}">${esc(qt)}</div>`;
      stage=`<section class="question-stage hidden-stage ${q.hiddenShowText&&qt?'has-media':''}">${hidden}</section>`;
    }else{
      let content='';
      if(q.hint)content+=`<div class="hint">힌트 · ${esc(q.hint)}</div>`;
      if(hasVideo)content+=`<div class="media-stage"><video src="${video}" controls playsinline></video></div>`;
      else if(hasImage)content+=`<div class="media-stage"><img src="${qImg}" alt="문제 이미지"></div>`;
      else if(hasAudio)content+=`<div class="media-stage"><div class="audio-card"><audio id="qAudio" src="${audio}" controls></audio></div></div>`;
      if(qt)content+=`<div class="question-text ${textSize}">${esc(qt)}</div>`;
      if(q.type==='ox'){
        content+=`<div class="ox"><div class="o">O</div><div class="x">X</div></div>`;
      }else if(q.answerType==='multiple'){
        const filledChoices=(q.choices||[]).map((c,n)=>({c:String(c||'').trim(),n})).filter(x=>x.c);
        if(filledChoices.length)content+=`<div class="choices">${filledChoices.map(x=>`<div class="choice"><span class="n">${x.n+1}</span><span>${esc(x.c)}</span></div>`).join('')}</div>`;
      }
      stage=`<section class="question-stage ${hasMedia?'has-media':''} ${hasChoices?'has-choices':''}">${content}</section>`;
    }
  }else{
    let ans=q.type==='ox'?String(q.oxAnswer||'O'):(q.answer||'').trim();
    if(q.answerType==='multiple'&&q.type!=='ox'&&!ans)ans=(q.choices||[])[q.correctChoice]||'';
    const answerSize=ans.length>90?'long':ans.length>50?'medium':'';
    if(q.type==='ox'){
      stage=`<section class="question-stage"><div class="answer-direct ox-answer"><div class="ox-answer-symbol">${esc(ans||'')}</div></div></section>`;
    }else{
      let inside='';
      if(aImg)inside+=`<div class="answer-media"><img src="${aImg}" alt="정답 이미지"></div>`;
      if(ans)inside+=`<div class="answer-text ${answerSize}">${esc(ans)}</div>`;
      stage=`<section class="question-stage"><div class="answer-direct">${inside}</div></section>`;
    }
  }

  document.getElementById('app').innerHTML=`<div class="event-shell"><main class="question-view">
    <header class="question-toolbar">
      <button id="boardBtn">← 문제판</button>
      <span>${answerVisible?(q.type==='ox'?'OX 정답':'정답'):(q.type==='ox'?'OX 문제':'문제')}</span>
    </header>
    ${stage}
    <footer class="question-footer"><button id="answerBtn">${answerVisible?'문제 다시 보기':'정답 보기'}</button></footer>
  </main></div>`;

  document.getElementById('boardBtn').addEventListener('click',async()=>{
    const wanted=!!document.fullscreenElement;
    answerVisible=false;currentView='home';renderHome();
    if(wanted&&!document.fullscreenElement){try{await enterFullscreen()}catch{}}
  });
  document.getElementById('answerBtn').addEventListener('click',async()=>{
    const wanted=!!document.fullscreenElement;
    answerVisible=!answerVisible;await renderQuestion(i);
    if(wanted&&!document.fullscreenElement){try{await enterFullscreen()}catch{}}
  });
  if(!answerVisible&&audio&&q.audioPlayback==='auto')setTimeout(()=>document.getElementById('qAudio')?.play().catch(()=>{}),80);
}

><div class="audio-options"><span>오디오 재생</span><label><input type="radio" name="audioPlayback" value="manual" ${q.audioPlayback!=='auto'?'checked':''}> 수동</label><label><input type="radio" name="audioPlayback" value="auto" ${q.audioPlayback==='auto'?'checked':''}> 자동재생</label></div><footer class="admin-form-footer"><div class="left-actions"><button type="button" class="clear-btn" id="clearQuestion">이 문제 초기화</button></div><span class="autosave-note" id="autosaveNote">변경 내용 자동 저장</span><button type="submit" class="save-btn">저장</button></footer></div><aside class="admin-preview"><div class="preview-head"><strong>실제 화면 미리보기</strong><div class="preview-tabs"><button type="button" class="preview-tab ${adminPreviewMode==='question'?'active':''}" data-preview-mode="question">문제</button><button type="button" class="preview-tab ${adminPreviewMode==='answer'?'active':''}" data-preview-mode="answer">정답</button></div></div><div class="preview-screen" id="previewScreen"></div></aside></div></form></div></section></main></div>`;
  wireCommonTopbar();document.querySelectorAll('[data-admin-num]').forEach(b=>b.addEventListener('click',()=>{saveAdminForm(false);adminIndex=Number(b.dataset.adminNum);adminPreviewMode='question';renderAdmin()}));document.getElementById('eventBtn').addEventListener('click',()=>{saveAdminForm(false);currentView='home';render()});document.getElementById('exportBtn').addEventListener('click',()=>{saveAdminForm(false);exportPack()});document.getElementById('importBtn').addEventListener('click',chooseImport);document.getElementById('adminForm').addEventListener('submit',e=>{e.preventDefault();saveAdminForm(true)});document.getElementById('clearQuestion').addEventListener('click',clearAdminQuestion);document.getElementById('qType').addEventListener('change',()=>{syncAdminDynamic();queueAutosave()});document.getElementById('answerType')?.addEventListener('change',()=>{syncAdminDynamic();queueAutosave()});['qText','qAnswer','qHint'].forEach(id=>document.getElementById(id)?.addEventListener('input',queueAutosave));document.querySelectorAll('input[name="audioPlayback"]').forEach(x=>x.addEventListener('change',queueAutosave));document.querySelectorAll('[data-preview-mode]').forEach(b=>b.addEventListener('click',()=>{adminPreviewMode=b.dataset.previewMode;document.querySelectorAll('[data-preview-mode]').forEach(x=>x.classList.toggle('active',x.dataset.previewMode===adminPreviewMode));updatePreview()}));syncAdminDynamic();wireMediaCards();updatePreview();
}

function syncAdminDynamic(){const q=state.questions[adminIndex],type=document.getElementById('qType')?.value||q.type,at=document.getElementById('answerType'),answerField=document.getElementById('answerTypeField'),hidden=document.getElementById('hiddenOption'),choices=document.getElementById('choicesHost');if(type==='ox'||type==='hidden'){answerField.style.display='none'}else answerField.style.display='grid';if(type==='hidden')hidden.innerHTML=`<label class="hidden-text-option"><input type="checkbox" id="hiddenShowText" ${q.hiddenShowText?'checked':''}> 숨은그림 문제에서 문제 글도 함께 표시</label>`;else hidden.innerHTML='';const answerType=type==='ox'?'multiple':(at?.value||q.answerType);if(type!=='ox'&&type!=='hidden'&&answerType==='multiple')choices.innerHTML=`<div class="admin-choices"><span>보기</span>${q.choices.map((c,i)=>`<label class="admin-choice"><strong>${i+1}</strong><input data-choice="${i}" value="${esc(c)}"></label>`).join('')}<label class="admin-field"><span>정답 번호</span><select id="correctChoice">${[0,1,2,3].map(i=>`<option value="${i}" ${q.correctChoice===i?'selected':''}>${i+1}번</option>`).join('')}</select></label></div>`;else if(type==='ox')choices.innerHTML=`<label class="admin-field"><span>OX 정답</span><select id="oxAnswer"><option value="O" ${q.oxAnswer==='O'?'selected':''}>O</option><option value="X" ${q.oxAnswer==='X'?'selected':''}>X</option></select></label>`;else choices.innerHTML='';document.getElementById('hiddenShowText')?.addEventListener('change',queueAutosave);document.querySelectorAll('[data-choice]').forEach(x=>x.addEventListener('input',queueAutosave));document.getElementById('correctChoice')?.addEventListener('change',queueAutosave);document.getElementById('oxAnswer')?.addEventListener('change',queueAutosave);updatePreview()}
function readAdminForm(q){const type=document.getElementById('qType')?.value||q.type;q.type=type;q.answerType=type==='ox'?'multiple':(document.getElementById('answerType')?.value||q.answerType);q.question=document.getElementById('qText')?.value||'';q.answer=document.getElementById('qAnswer')?.value||'';q.hint=document.getElementById('qHint')?.value||'';q.hiddenShowText=!!document.getElementById('hiddenShowText')?.checked;q.audioPlayback=document.querySelector('input[name="audioPlayback"]:checked')?.value||'manual';if(type==='ox')q.oxAnswer=document.getElementById('oxAnswer')?.value||'O';if(q.answerType==='multiple'&&type!=='ox')q.choices=[0,1,2,3].map(i=>document.querySelector(`[data-choice="${i}"]`)?.value||q.choices[i]||''),q.correctChoice=Number(document.getElementById('correctChoice')?.value||q.correctChoice||0);return q}

async function clearAdminQuestion(){if(!confirm(`${adminIndex+1}번 문제의 글과 연결된 미디어를 모두 비울까요?`))return;const q=state.questions[adminIndex];for(const k of Object.values(q.media||{})){if(k&&!/^data:|^https?:|^\//.test(k)){try{await dbDelete(k)}catch{}revokeMedia(k)}}state.questions[adminIndex]=emptyQuestion(adminIndex+1);saveState();renderAdmin()}
function mediaCard(q,kind,label,accept){const key=q.media[kind],name=q.mediaNames?.[kind]||key||'';return `<section class="media-card" data-drop-kind="${kind}"><div class="media-card-title"><span>${label}</span><span>${kind==='audio'?'♬':kind==='video'?'▣':'↗'}</span></div><div class="media-drop" data-preview-kind="${kind}"><div><div class="bigicon">⌑</div><b>${label} 등록</b><small>드래그하거나 클릭해서 선택</small></div></div><div class="media-filename">${esc(name||'등록된 파일 없음')}</div><div class="media-actions"><label>파일 선택<input type="file" accept="${accept}" data-media-input="${kind}"></label>${key?`<button type="button" data-media-remove="${kind}">삭제</button>`:''}</div></section>`}
function wireMediaCards(){document.querySelectorAll('[data-media-input]').forEach(inp=>inp.addEventListener('change',e=>{const f=e.currentTarget.files?.[0];if(f)handleMediaFile(e.currentTarget.dataset.mediaInput,f)}));document.querySelectorAll('[data-media-remove]').forEach(b=>b.addEventListener('click',()=>removeMedia(b.dataset.mediaRemove)));document.querySelectorAll('[data-drop-kind]').forEach(card=>{const kind=card.dataset.dropKind;card.addEventListener('click',e=>{if(e.target.closest('button,label,input'))return;card.querySelector(`[data-media-input="${kind}"]`)?.click()});card.addEventListener('dragover',e=>{e.preventDefault();card.classList.add('is-drag')});card.addEventListener('dragleave',()=>card.classList.remove('is-drag'));card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('is-drag');const f=e.dataTransfer?.files?.[0];if(f)handleMediaFile(kind,f)})});refreshMediaPreviews()}
async function optimizeImageFile(file){
  if(!file?.type?.startsWith('image/'))return file;
  try{
    const img=await createImageBitmap(file),maxEdge=Math.max(img.width,img.height);
    if(maxEdge<=1920){img.close?.();return file}
    const scale=1920/maxEdge,w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx){img.close?.();return file}ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,w,h);img.close?.();
    const blob=await new Promise(res=>canvas.toBlob(res,file.type==='image/png'?'image/png':file.type,0.9));return blob||file;
  }catch{return file}
}
async function handleMediaFile(kind,file){const q=state.questions[adminIndex],key=qKey(q.number,kind);const stored=(kind==='questionImage'||kind==='answerImage')?await optimizeImageFile(file):file;await dbPut(key,stored);revokeMedia(key);q.media[kind]=key;q.mediaNames[kind]=file.name;saveState();toast(`${file.name} 저장됨`);renderAdmin()}
async function removeMedia(kind){const q=state.questions[adminIndex],key=q.media[kind];if(key&&!/^data:|^https?:|^\//.test(key)){try{await dbDelete(key)}catch{}revokeMedia(key)}q.media[kind]=null;delete q.mediaNames[kind];saveState();renderAdmin()}
async function refreshMediaPreviews(){const q=state.questions[adminIndex];for(const kind of ['questionImage','answerImage','video','audio']){const host=document.querySelector(`[data-preview-kind="${kind}"]`);if(!host)continue;const url=await mediaUrl(q.media[kind]);if(!url)continue;if(kind==='questionImage'||kind==='answerImage')host.innerHTML=`<img src="${url}" alt="${kind}">`;else if(kind==='video')host.innerHTML=`<video src="${url}" muted preload="metadata"></video>`;else host.innerHTML=`<div><div class="bigicon">♬</div><b>오디오 등록됨</b><small>${esc(q.mediaNames[kind]||'오디오 파일')}</small></div>`}}
async function updatePreview(){const host=document.getElementById('previewScreen');if(!host)return;const base=state.questions[adminIndex],q=normalizeQuestion(JSON.parse(JSON.stringify(base)),adminIndex+1);readAdminForm(q);const qImg=await mediaUrl(base.media.questionImage),aImg=await mediaUrl(base.media.answerImage),video=await mediaUrl(base.media.video);let media=null;if(adminPreviewMode==='question'){if(q.type==='video'&&video)media=`<div class="preview-media"><video src="${video}" muted></video></div>`;else if(['image','person','hidden'].includes(q.type)&&qImg)media=`<div class="preview-media"><img src="${qImg}" alt="문제"></div>`}else if(aImg)media=`<div class="preview-media"><img src="${aImg}" alt="정답"></div>`;let txt=adminPreviewMode==='question'?q.question:(q.type==='ox'?q.oxAnswer:(q.answer||((q.answerType==='multiple')?q.choices[q.correctChoice]:'')));let body='';if(adminPreviewMode==='question'&&q.hint)body+=`<div class="preview-hint">힌트 · ${esc(q.hint)}</div>`;if(media)body+=media;if((q.type!=='hidden'||q.hiddenShowText||adminPreviewMode==='answer'))body+=`<div class="preview-text ${media?'with-image':''}">${esc(txt||'')}</div>`;if(adminPreviewMode==='question'&&q.type==='ox')body+=`<div class="preview-choice-grid"><div class="preview-choice"><span class="preview-choice-number">O</span><span>O</span></div><div class="preview-choice"><span class="preview-choice-number">X</span><span>X</span></div></div>`;else if(adminPreviewMode==='question'&&q.answerType==='multiple'&&q.type!=='ox')body+=`<div class="preview-choice-grid">${q.choices.map((c,i)=>`<div class="preview-choice"><span class="preview-choice-number">${i+1}</span><span>${esc(c||'')}</span></div>`).join('')}</div>`;host.innerHTML=`<div class="preview-top"><span>4×4 BOARD</span><span>${adminIndex+1}번</span></div><div class="preview-body">${body}</div><div class="preview-score">${adminIndex+1}번</div>`}

async function exportPack(){try{toast('데이터팩을 만드는 중입니다…');saveAdminForm(false);const keys=await dbKeys(),blobs=[],media=[];let offset=0;for(const key of keys){const blob=await dbGet(key);if(!blob)continue;media.push({key:String(key),type:blob.type||'application/octet-stream',size:blob.size,offset});blobs.push(blob);offset+=blob.size}const manifest={app:APP,format:4,createdAt:new Date().toISOString(),state,media};const enc=new TextEncoder(),magic=enc.encode(PACK_MAGIC),header=enc.encode(JSON.stringify(manifest)),len=new Uint8Array(4);new DataView(len.buffer).setUint32(0,header.byteLength,true);const pack=new Blob([magic,len,header,...blobs],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(pack);a.download=`BibleGoldenBell_4X4_${dateStamp()}.bb4`;document.body.appendChild(a);a.click();const u=a.href;a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('데이터팩 저장 완료')}catch(e){console.error(e);alert('데이터 저장 중 오류: '+e.message)}}
function chooseImport(){const inp=document.getElementById('importFile');inp.value='';inp.click()}
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{await importPack(file);toast('데이터 불러오기 완료');currentView='home';render()}catch(err){console.error(err);alert('이 데이터 파일을 불러올 수 없습니다.\n'+err.message)}})
async function importPack(file){const buf=await file.arrayBuffer(),u8=new Uint8Array(buf),enc=new TextEncoder(),magic=enc.encode(PACK_MAGIC);let match=u8.length>magic.length+4;for(let i=0;i<magic.length&&match;i++)if(u8[i]!==magic[i])match=false;if(match){const dv=new DataView(buf),headerLen=dv.getUint32(magic.length,true),hs=magic.length+4,he=hs+headerLen;if(he>buf.byteLength)throw new Error('데이터팩 헤더가 손상되었습니다.');const manifest=JSON.parse(new TextDecoder().decode(u8.slice(hs,he)));if(manifest.app!==APP)throw new Error('BibleGoldenBell 4X4 데이터가 아닙니다.');await dbClear();mediaUrlCache.forEach(URL.revokeObjectURL);mediaUrlCache.clear();for(const m of manifest.media||[]){const st=he+Number(m.offset||0),en=st+Number(m.size||0);if(st<he||en>buf.byteLength)throw new Error('미디어 데이터가 손상되었습니다.');await dbPut(m.key,new Blob([buf.slice(st,en)],{type:m.type||'application/octet-stream'}))}state=normalizeState(manifest.state);saveState();progress=defaultProgress();saveProgress();return}const txt=new TextDecoder().decode(u8),old=JSON.parse(txt),src=old.state||old;if(!src.questions)throw new Error('지원하지 않는 데이터 형식입니다.');state=normalizeState(src);saveState();progress=defaultProgress();saveProgress()}

render();
})();
